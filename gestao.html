<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão — Feitoria</title>
<style>
  :root{--verde:#1f4d3a;--ambar:#c8871f;--fundo:#f4f2ed;--carta:#fff;--texto:#23261f;
        --suave:#6b7169;--erro:#a3341f;--ok:#1f6b3f;--borda:#e2ded4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);
       color:var(--texto);padding:16px}
  .app{max-width:860px;margin:0 auto}
  .carta{background:var(--carta);border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:16px;margin:0 0 12px}
  .sub{color:var(--suave);font-size:14px;margin:0 0 16px}
  label{display:block;font-size:13px;color:var(--suave);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--borda);border-radius:9px;
               font:inherit;background:#fff;color:var(--texto)}
  textarea{resize:vertical;line-height:1.5}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:11px 16px;
         background:var(--verde);color:#fff;font-weight:600}
  button.secundaria{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
  button.discreto{background:none;color:var(--suave);font-weight:500;padding:8px 10px}
  button[disabled]{opacity:.5;cursor:default}
  .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .linha>*{flex:1;min-width:140px}
  .linha button{flex:0 0 auto}
  .abas{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .abas button{background:#eceae4;color:var(--texto)}
  .abas button.ativa{background:var(--verde);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--borda);vertical-align:middle}
  th{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
  td.hora{font-variant-numeric:tabular-nums;font-weight:600}
  .etiqueta{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
            background:#eceae4;color:var(--suave)}
  .etiqueta.ponto{background:#e6efe9;color:var(--ok)}
  .etiqueta.grave{background:#fdf3f1;color:var(--erro)}
  .etiqueta.atencao{background:#fdf3e6;color:var(--ambar)}
  .etiqueta.aviso{background:#eceae4;color:var(--suave)}
  .selo{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:99px;
        background:var(--erro);color:#fff;font-size:11px;font-weight:700}
  .abas button.ativa .selo{background:#fff;color:var(--erro)}
  .etiqueta.correcao{background:#fdf3e6;color:var(--ambar)}
  .etiqueta.substituida{background:#f3eceb;color:var(--erro);text-decoration:line-through}
  .aviso{background:#fdf3f1;color:var(--erro);border-radius:9px;padding:11px;font-size:14px;margin:10px 0}
  .ok{background:#eef3ef;color:var(--ok);border-radius:9px;padding:11px;font-size:14px;margin:10px 0}
  .vazio{color:var(--suave);font-size:14px}
  dialog{border:none;border-radius:16px;padding:22px;max-width:420px;width:92%;
         box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.45)}

  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
  .app{max-width:1320px}
  .cabecalho{border-top:4px solid var(--verde)}
  .estrutura{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
  .menu-gestao{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow-y:auto;background:white;border:1px solid var(--borda);border-radius:16px;padding:16px}
  .menu-gestao label{margin-top:0}
  .abas{display:block;margin:12px 0 0}
  .grupo-menu{margin-top:18px}
  .grupo-menu h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);margin:0 8px 6px}
  .abas button{display:block;width:100%;text-align:left;background:transparent;padding:10px 12px;font-size:13px;margin:3px 0;min-height:44px}
  .abas button:hover{background:#edf3ef;color:var(--verde)}
  .abas button.ativa{background:var(--verde);color:white}
  .area-gestao{min-width:0}
  .titulo-area{margin:4px 0 20px}
  .titulo-area h2{font-size:26px;letter-spacing:-.025em;margin:3px 0 6px}
  .titulo-area .sub{margin:0}
  .sobretitulo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--verde);font-weight:700}
  .grade-atalhos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .atalho{display:flex;flex-direction:column;gap:7px;text-align:left;background:white;color:var(--texto);border:1px solid var(--borda);padding:18px;min-height:112px;transition:border-color .15s}
  .atalho:hover{border-color:var(--verde);background:#f8faf8}
  .atalho small{font-size:13px;color:var(--suave);line-height:1.5;font-weight:400}
  .atalho span{font-size:12px;color:var(--verde);margin-top:auto}
  .destaque-inicio{background:var(--verde);color:white;padding:24px;border-radius:16px;margin-bottom:20px}
  .destaque-inicio h2{font-size:23px;margin-bottom:8px}
  .destaque-inicio p{margin:0;line-height:1.6;color:#e0ece5}
  #conteudo{overflow-x:auto}
  dialog{max-height:90dvh;overflow:auto}
  @media(max-width:900px){
    body{padding:12px}.estrutura{display:block}.menu-gestao{position:static;max-height:none;margin-bottom:18px;padding:12px}
    .abas{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}
    .grupo-menu{display:flex;flex:0 0 auto;gap:4px;margin:0;padding-right:8px;border-right:1px solid var(--borda)}
    .grupo-menu h2{display:none}.abas button{width:auto;white-space:nowrap;margin:0}
    .titulo-area h2{font-size:22px}.cabecalho .linha{align-items:center}
  }
  @media(max-width:520px){.grade-atalhos{grid-template-columns:1fr}.carta{padding:16px}.linha>*{min-width:120px}}

</style>
</head>
<body>

<script type="module">

const URL_SB = "https://kujelbcbrcmkitzyswbh.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ";
const sb = createClient(URL_SB, ANON);

const app = document.getElementById("app");

/* A07 da revisão: nada do servidor entra como HTML.
   esc()   — texto e valor de atributo. Um nome com < ou " deixa de virar marcação.
   guarde()— payload de botão. Antes ia JSON cru dentro de atributo com apóstrofo:
             um nome com ' quebrava o atributo. Agora o atributo leva só o índice,
             e o objeto fica em CARGA, na memória da página. CARGA cresce a cada
             desenho da tela e é descartada quando a página recarrega — são poucos
             objetos pequenos, não vale um controle de ciclo de vida. */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
const CARGA = [];
const guarde = (o) => CARGA.push(o) - 1;
let unidades = [], unidade = null, aba = new URLSearchParams(location.search).has("historico") ? "historico-financeiro" : new URLSearchParams(location.search).has("boletim") ? "boletim" : "inicio";
let pendenciasAbertas = 0;   // aparece como selo na aba Pendências
let recadosAbertos = 0;      // idem, na aba Operação
let acoesVencidas = 0;       // idem, na aba NR-1: ação de risco com prazo passado
let checklistsAbertos = 0;   // idem, na aba Checklists: ocorrência crítica aberta

const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR",
  { hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" });
// A16 da revisão: o dia operacional era calculado no navegador, com o fuso do
// aparelho. Um tablet configurado errado mudava a régua do relatório. Agora a
// data vem do servidor (public.data_operacional), que é a mesma régua usada
// pelo ponto, pela folha e pelo detector de pendências. O cálculo local fica
// só como último recurso, e a tela avisa quando está nele.
let diaOperacional = null;
const hojeLocalAproximado = () => {
  const d = new Date(Date.now() - 3600e3);
  return new Date(d.toLocaleString("en-US", { timeZone:"America/Sao_Paulo" }))
    .toISOString().slice(0,10);
};
const hojeLocal = () => diaOperacional || hojeLocalAproximado();

const rotuloOrigem = (m) => {
  if(m.por === "gestor") return "gestão";
  return { totem:"tablet", celular:"celular" }[m.origem] || m.origem || "—";
};

async function chamar(payload){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) { telaLogin("Sua sessão expirou. Entre de novo."); throw new Error("sem sessão"); }
  const r = await fetch(`${URL_SB}/functions/v1/gestao-equipe`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify({ restaurant_id: unidade?.id, ...payload })
  });
  const d = await r.json().catch(()=>({error:"Resposta inválida."}));
  if(!r.ok) throw new Error(d.error || "Não foi possível completar.");
  return d;
}

/* ---------- login ---------- */
function telaLogin(msg){
  app.innerHTML = `
    <div class="carta" style="max-width:380px;margin:60px auto">
      <h1>Gestão da Feitoria</h1>
      <p class="sub">Entre com seu e-mail e senha</p>
      ${msg ? `<div class="aviso">${esc(msg)}</div>` : ""}
      <label for="email">E-mail</label><input type="email" id="email" autocomplete="username">
      <label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password">
      <button id="entrar" style="width:100%;margin-top:16px">Entrar</button>
    </div>`;
  const entrar = async () => {
    const bt = document.getElementById("entrar");
    bt.disabled = true; bt.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("senha").value
    });
    if(error) return telaLogin("E-mail ou senha incorretos.");
    iniciar();
  };
  document.getElementById("entrar").onclick = entrar;
  document.getElementById("senha").onkeydown = (e) => {
    if(e.key === "Enter") {
      e.preventDefault();
      entrar();
    }
  };
}


const AREAS = [
  ["Começar", [["inicio","Visão geral","Os caminhos para cuidar da casa, da equipe e dos resultados."]]],
  ["Operação", [
    ["chk","Checklists","Acompanhe execuções, atrasos e ocorrências da operação."],
    ["compras","Compras e recebimentos","Solicite, aprove e confira entregas com referências de notas e financeiro."],
    ["rotinas-gerente","Rotinas do gerente","Confira a operação e encaminhe as decisões do turno."],

    ["oper","Escala e recados","Publique a escala e acompanhe os recados da equipe."]]],
  ["Pessoas", [
    ["equipe","Equipe e cadastros","Cadastre pessoas, altere horários e prepare documentos."],
    ["ponto","Ponto do dia","Consulte as marcações e registre correções com motivo."],
    ["pend","Pendências de ponto","Revise faltas, ajustes e marcações que precisam de atenção."],
    ["escala","Jornadas e feriados","Configure jornadas, exceções e regras do ponto."],

  ["Resultados", [

    ["vendas","Vendas e horários","Explore produtos, vendedores e horários de maior movimento."],
    ["resultados","Resultados e metas","Consulte DRE, custos, CMV, CMO e metas."],
    ["financeiro","Financeiro Takeat","Consulte os lançamentos importados da Takeat."],
    ["notas","Notas fiscais","Confira as notas recebidas e seus detalhes."],

  ["Configuração", [["acessos","Links e acessos","Encontre os endereços para a equipe e o totem."]]]
];
const areaAtual=()=>AREAS.flatMap(([,itens])=>itens).find(([id])=>id===aba)||AREAS[0][1][0];
const solicitada=location.hash.slice(1);
if(AREAS.some(([,itens])=>itens.some(([id])=>id===solicitada)))aba=solicitada;
function menuGestao(){
  const selos={pend:pendenciasAbertas,oper:recadosAbertos,chk:checklistsAbertos,nr1:acoesVencidas};
  return AREAS.map(([grupo,itens])=>`<section class="grupo-menu"><h2>${grupo}</h2>${itens.map(([id,nome,descricao])=>`<button data-aba="${id}" data-busca="${esc(nome+' '+descricao)}" class="${aba===id?'ativa':''}" aria-current="${aba===id?'page':'false'}">${nome}${selos[id]?`<span class="selo">${selos[id]}</span>`:''}</button>`).join('')}</section>`).join('');
}
function abaInicio(){
  const atalhos=[
    ["chk","Conferir a operação","Checklists, atrasos e ocorrências do turno."],
    ["compras","Organizar as compras","Solicitações, aprovações e conferências de entrega."],
    ["rotinas-gerente","Conferir rotinas de gestão","Acompanhe as responsabilidades do gerente."],
    ["equipe","Cuidar da equipe","Admissão, ficha, jornada e movimentações."],
    ["docs","Acompanhar documentos","Envios e assinaturas pendentes."],
    ["folha","Fechar o ponto","Marcações do mês e planilha de fechamento."],
    ["boletim","Ler o boletim","Destaques e pendências para suas decisões."],
    ["resultados","Entender os resultados","Vendas, custos, DRE e metas da casa."]
  ];
  conteudo().innerHTML=`<div class="destaque-inicio"><h2>O que vamos cuidar agora?</h2><p>${esc(unidade.name)} · Escolha uma tarefa ou use o menu para explorar as áreas.</p></div><div class="grade-atalhos">${atalhos.map(([id,titulo,descricao])=>`<button class="atalho" data-destino="${id}"><strong>${titulo}</strong><small>${descricao}</small><span>Abrir área →</span></button>`).join('')}</div><p class="sub" style="margin-top:20px">Para compartilhar o portal com a equipe, abra <button class="discreto" data-destino="acessos">Links e acessos</button>.</p>`;
}

/* ---------- moldura ---------- */
async function iniciar(){
  try {
    const r = await chamar({ action:"unidades" });
    unidades = r.unidades;
    if(!unidades.length) return telaLogin("Seu usuário não administra nenhuma unidade.");
    unidade = unidades.find(u => u.id === unidade?.id) || unidades.find(u => u.id === "ba705d74-ae0a-40ef-9150-f183bfdc6aee") || unidades[0];
    diaOperacional = r.dia_operacional || null;
    moldura(r.usuario);
    atualizarSelo();
  } catch(e){ telaLogin(e.message); }
}

function moldura(usuario){
  app.innerHTML = `
    <div class="carta cabecalho">
      <div class="linha">
        <div>
          <h1>Gestão da Feitoria</h1>
          <p class="sub" style="margin:0">${esc(usuario)}</p>
        </div>
        <div style="flex:0 0 200px">
          <label>Unidade</label>
          <select id="unidade">${unidades.map(u =>
            `<option value="${u.id}" ${u.id===unidade.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
        </div>
        <button class="discreto" id="sair">Sair</button>
      </div>
    </div>
    <div class="estrutura">
      <aside class="menu-gestao">
        <label for="buscar-area">Encontrar uma área</label>
        <input type="search" id="buscar-area" placeholder="Ex.: ponto, metas, documentos">
        <nav class="abas" aria-label="Áreas da gestão">${menuGestao()}</nav>
        <p id="menu-vazio" class="sub" role="status" hidden>Nenhuma área encontrada.</p>
      </aside>
      <main class="area-gestao" id="area-principal">
        <header class="titulo-area"><span class="sobretitulo">Feitoria · Gestão</span><h2>${esc(areaAtual()[1])}</h2><p class="sub">${esc(areaAtual()[2])}</p></header>
        <div id="conteudo"></div>
      </main>
    </div>`;

  document.getElementById("unidade").onchange = (e) => {
    // A15 da revisão: antes só re-renderizava. Filtro de pessoa, período da
    // folha, dia escolhido e o selo de pendências continuavam da unidade
    // anterior — dados de uma casa aparecendo sob o nome da outra.
    unidade = unidades.find(u => u.id === e.target.value);
    filtroPessoa = "";
    folhaFiltro = { employee_id:"", ...mesAtual() };
    pendSituacao = "aberta";
    diaEscolhido = null;
    pendenciasAbertas = 0;
    acoesVencidas = 0;
    checklistsAbertos = 0;
    moldura(usuario);
    atualizarSelo();
  };
  document.getElementById("sair").onclick = async () => { await sb.auth.signOut(); telaLogin(); };
  const navegar=(id)=>{ aba=id; history.replaceState(null,"","#"+id); moldura(usuario); };
  app.querySelectorAll("[data-aba]").forEach(b => b.onclick=()=>navegar(b.dataset.aba));
  document.getElementById("buscar-area").oninput=e=>{
    const normalizar=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    const busca=normalizar(e.target.value.trim());
    app.querySelectorAll("[data-busca]").forEach(b=>b.hidden=!normalizar(b.dataset.busca).includes(busca));
    app.querySelectorAll(".grupo-menu").forEach(g=>g.hidden=![...g.querySelectorAll("button")].some(b=>!b.hidden));
    document.getElementById("menu-vazio").hidden=!!app.querySelector(".grupo-menu:not([hidden])");
  };
  render();
  conteudo().onclick=e=>{const b=e.target.closest("[data-destino]");if(b)navegar(b.dataset.destino);};
}
const render = () => aba === "inicio" ? abaInicio() : aba === "acessos" ? abaAcessos() : aba === "equipe" ? abaEquipe()
  : aba === "compras" ? abaCompras()
  : aba === "boletim" ? abaBoletim()
  : aba === "resultados" ? abaResultados()
  : aba === "notas" ? abaNotas()
  : aba === "historico-financeiro" ? abaHistoricoFinanceiro()
  : aba === "financeiro" ? abaFinanceiro()
  : aba === "vendas" ? abaVendas()
  : aba === "ponto" ? abaPonto()
  : aba === "pend" ? abaPendencias()
  : aba === "escala" ? abaEscala()
  : aba === "oper" ? abaOperacao()
  : aba === "nr1" ? abaNr1()
  : aba === "chk" ? abaChecklists()
  : aba === "rotinas-gerente" ? abaRotinasGestao("gerente")
  : aba === "rotinas-dono" ? abaRotinasGestao("dono")
  : aba === "folha" ? abaFolha()
  : abaDocs();
const conteudo = () => document.getElementById("conteudo");

async function abrirFicha(pessoa){
  const { ficha, empresa } = await chamarGerar({ action:"ficha", employee_id: pessoa.id });
  const v = (c) => (ficha?.[c] ?? "");
  const d = document.createElement("dialog");
  d.style.maxWidth = "560px";
  d.innerHTML = `
    <h2>Ficha de ${esc(pessoa.nome)}</h2>
    <p class="sub">É daqui que saem os documentos. Campo vazio impede gerar o que depende dele.</p>
    ${empresa ? "" : `<div class="aviso">Cadastre os dados da empresa antes.</div>`}
    ${CAMPOS_FICHA.map(([grupo, campos]) => `
      <h2 style="margin:18px 0 2px;font-size:14px">${grupo}</h2>
      ${campos.map(([c, rotulo, tipo]) => {
        if(tipo === "aviso") return `<p class="sub" style="margin:8px 0 0;font-size:12px">
          A data de nascimento fica no cadastro do colaborador, na aba Equipe.</p>`;
        if(tipo.startsWith("select:")) return `<label>${rotulo}</label>
          <select id="fi-${c}">${["", ...tipo.slice(7).split(",")].map(o =>
            `<option value="${o}" ${v(c)===o?"selected":""}>${o || "—"}</option>`).join("")}</select>`;
        return `<label>${rotulo}</label>
          <input type="${tipo}" id="fi-${c}" value="${esc(v(c))}">`;
      }).join("")}`).join("")}
    <div id="fi-erro"></div>
    <div class="linha" style="margin-top:20px">
      <button id="fi-salvar">Salvar ficha</button>
      <button class="secundaria" id="fi-cancelar">Fechar</button>
    </div>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#fi-cancelar").onclick = () => d.close();
  d.addEventListener("close", () => d.remove());
  d.querySelector("#fi-salvar").onclick = async (ev) => {
    ev.target.disabled = true;
    const dados = { action:"salvar_ficha", employee_id: pessoa.id, company_id: empresa?.id };
    for(const [, campos] of CAMPOS_FICHA)
      for(const [c,, tipo] of campos){
        if(tipo === "aviso") continue;
        const el = d.querySelector(`#fi-${c}`);
        if(el) dados[c] = el.value;
      }
    try { await chamarGerar(dados); d.close(); abaEquipe(); }
    catch(e){ ev.target.disabled = false;
      d.querySelector("#fi-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`; }
  };
}

  const d = document.createElement("dialog");

      `<option value="${esc(m.id)}">${esc(m.codigo)} — ${esc(m.titulo)}</option>`).join("")}</select>

    <input type="date" id="g-data" value="${hojeLocal()}">

    <div id="g-erro"></div>
    <div class="linha" style="margin-top:18px">
      <button class="secundaria" id="g-previa">Conferir antes</button>
      <button id="g-gerar">Gerar</button>
      <button class="discreto" id="g-cancelar">Cancelar</button>
    </div>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#g-cancelar").onclick = () => d.close();
  d.addEventListener("close", () => d.remove());

  const payload = () => ({
    employee_id: d.querySelector("#g-pessoa").value,
    template_id: d.querySelector("#g-modelo").value,
    data_documento: d.querySelector("#g-data").value,
    prazo: d.querySelector("#g-prazo").value || null,
  });
  const erro = d.querySelector("#g-erro");

  d.querySelector("#g-previa").onclick = async () => {
    erro.innerHTML = `<p class="vazio">Conferindo…</p>`;
    try {
      const r = await chamarGerar({ action:"previa", ...payload() });
      erro.innerHTML = r.pronto
        ? `<div class="ok">Tudo preenchido. ${r.blocos.length} blocos.</div>`
        : `<div class="aviso">Falta na ficha: ${esc((r.faltando||[]).join(", ") || "—")}

    } catch(e){ erro.innerHTML = `<div class="aviso">${esc(e.message)}</div>`; }
  };

  d.querySelector("#g-gerar").onclick = async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Gerando…";
    try {
      const r = await chamarGerar({ action:"gerar", ...payload() });
      d.close();
      alert(`"${esc(r.titulo)}" gerado.\nImpressão digital: ${esc(r.sha256_curto)}`);
      abaDocs();

/* ---------- publicar a folha do mês (holerite e vale-transporte) ---------- */
// A contabilidade manda um PDF só, com todo mundo junto. Esta tela separa por
// pessoa e publica cada pedaço para assinatura no portal.
//
// Por que a separação acontece AQUI e não no servidor: o casamento entre o nome
// impresso no PDF e o cadastro é a parte que erra. Separar no navegador deixa
// você conferir a lista antes de publicar — e documento publicado no nome errado
// é pior do que documento não publicado.
//
// Dois formatos, porque a contabilidade usa dois:
//   Recibo de Pagamento        -> uma página por pessoa. Separa limpo.
//   Recibo de Vale Transporte  -> vários recibos empilhados na mesma página.
//
// COMO O VALE-TRANSPORTE EMPILHADO É SEPARADO (01/10): recortar a página NÃO
// serve. Testei os dois caminhos — mudar o MediaBox e usar embedPage com
// bounding box — e nos dois o nome, o CPF e o valor da outra pessoa continuavam
// dentro do arquivo: o recorte esconde, não apaga, e qualquer extrator de texto
// traz de volta. Entregar assim seria dar o dado de um colega para o outro com
// aparência de protegido.
// A saída é desenhar de novo: a faixa do recibo é renderizada em imagem a 200
// dpi e vira uma página nova. O que ficou fora não existe no arquivo, porque o
// arquivo é feito só daquele pedaço. O preço é que o texto deixa de ser
// selecionável — aceitável num recibo que vai ser lido e assinado, e o selo
// SHA-256 da assinatura continua provando o conteúdo. Melhor ainda seria a
// contabilidade mandar um recibo por página, como já faz no holerite.

const semAcento = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "");
const chaveNome = (s) => semAcento(s).toUpperCase().replace(/[^A-Z ]/g, " ").replace(/\s+/g, " ").trim();
const MESES_PT = ["janeiro","fevereiro","marco","abril","maio","junho",
                  "julho","agosto","setembro","outubro","novembro","dezembro"];

/** Agrupa os pedaços de texto do pdf.js em linhas, de cima para baixo.
    Agrupa por proximidade, não por valor exato: numa mesma linha da tabela o
    gerador do PDF varia meio ponto na altura, e arredondar partia a linha em
    duas — foi o que fez a leitura dos campos falhar na primeira versão. */
function linhasDaPagina(conteudoTexto){
  const itens = conteudoTexto.items
    .filter(i => i.str && i.str.trim())
    .map(i => ({ y:i.transform[5], x:i.transform[4], txt:i.str }))
    .sort((a,b) => b.y - a.y);

  const linhas = [];
  for(const it of itens){
    const ultima = linhas[linhas.length - 1];
    if(ultima && Math.abs(ultima.y - it.y) <= 2) ultima.partes.push(it);
    else linhas.push({ y:it.y, partes:[it] });
  }
  return linhas.map(l => ({
    y: l.y,
    texto: l.partes.sort((a,b) => a.x - b.x).map(p => p.txt).join(" ").replace(/\s+/g, " ").trim(),
  }));
}

function competenciaDeTexto(texto){
  const m = /\b([A-Za-zç]+)\s+de\s+(\d{4})/.exec(semAcento(texto));
  if(!m) return null;
  const i = MESES_PT.indexOf(m[1].toLowerCase());
  return i < 0 ? null : `${m[2]}-${String(i+1).padStart(2,"0")}`;
}

/** Lê o PDF consolidado e devolve um item por documento a publicar. */
async function lerConsolidado(pdfjs, arquivo, especie, guardaPdf){
  const bytes = new Uint8Array(await arquivo.arrayBuffer());
  const pdf = await pdfjs.getDocument({ data: bytes }).promise;
  if(guardaPdf) guardaPdf.set(arquivo, pdf);
  const achados = [];

  for(let p = 1; p <= pdf.numPages; p++){
    const pagina = await pdf.getPage(p);
    const linhas = linhasDaPagina(await pagina.getTextContent());

    if(especie === "holerite"){
      // "12 PESSOA EXEMPLO 513505 1 1"
      let nome = null;
      for(const l of linhas){
        const m = /^(\d+)\s+([A-ZÀ-Ü][A-ZÀ-Ü\s.]{4,}?)\s+\d{6}\b/.exec(l.texto);
        if(m){ nome = m[2].trim(); break; }
      }
      const comp = linhas.map(l => competenciaDeTexto(l.texto)).find(Boolean) || null;
      achados.push({ pagina:p, nome, competencia:comp, dados:null, recorte:null });
    } else {
      // Cada "RECIBO DE VALE TRANSPORTE" abre um bloco. Agrupo as linhas de
      // cada bloco e leio os campos: é com eles que o recibo individual é
      // emitido, em vez de recortar a página alheia.
      const topos = [];
      for(const l of linhas){
        if(/^RECIBO DE VALE TRANSPORTE/i.test(l.texto)) topos.push({ y:l.y, linhas:[] });
        else if(topos.length) topos[topos.length-1].linhas.push(l.texto);
      }
      const juntos = topos.length > 1;
      const [, , largura, altura] = pagina.view;
      topos.forEach((t, k) => {
        const dados = camposDoVale(t.linhas);
        // Se a leitura dos campos falhar, cai no redesenho da faixa — pior,
        // mas nunca entrega o recibo do colega junto.
        const baixo = k + 1 < topos.length ? topos[k+1].y + 30 : 0;
        const alto  = Math.min(altura, t.y + 30);
        achados.push({
          pagina: p, nome: dados?.nome ?? null, competencia: dados?.competencia ?? null,
          dados: dados,
          recorte: (juntos && !dados)
            ? { x:0, baixo, largura, altura: alto - baixo, alturaPagina: altura } : null,
        });
      });
    }
  }
  return achados;
}

/** Lê os campos de um recibo de vale-transporte. Devolve null se faltar o
    essencial — melhor cair no redesenho do que emitir recibo com buraco. */
function camposDoVale(linhas){
  const txt = linhas.join("\n");
  const d = {};

  const mn = /Nome:\s*(\d+)\s*-\s*(.+?)\s+CPF:\s*([\d.\-]+)/.exec(txt);
  if(!mn) return null;
  d.codigo = mn[1]; d.nome = mn[2].trim(); d.cpf = mn[3].trim();

  const mc = /Cargo:\s*(.+?)\s+Depto\.?:\s*(.+?)\s*$/m.exec(txt);
  d.cargo = mc ? mc[1].trim() : "";
  d.depto = mc ? mc[2].trim() : "";

  // "250 MOGI DAS CRUZES R$ 5,50 48 x 5,50 R$ 264,00" — pode ter mais de uma
  d.transportes = [];
  for(const l of linhas){
    const mt = /^(\d+)\s+(.+?)\s+R\$\s*([\d.,]+)\s+(.+?)\s+R\$\s*([\d.,]+)\s*$/.exec(l.trim());
    if(mt) d.transportes.push({ codigo:mt[1], nome:mt[2].trim(), unitario:mt[3],
                                quantidade:mt[4].trim(), total:mt[5] });
  }
  if(!d.transportes.length) return null;

  const mtot = /Total do valor fornecido[.\s]*:?\s*R\$\s*([\d.,]+)/.exec(txt);
  d.total = mtot ? mtot[1] : null;
  if(!d.total) return null;

  const me = /Recebi de\s+(.+?)\s+a quantidade/.exec(txt);
  d.empresa = me ? me[1].trim() : "";

  const mp = /per[ií]odo de\s+([A-Za-zç]+ de \d{4})/.exec(semAcento(txt).replace(/\n/g, " "));
  d.periodo = mp ? mp[1] : "";
  d.competencia = competenciaDeTexto(d.periodo);

  const md = /^([A-ZÀ-Ü][A-ZÀ-Ü\s.]+),\s*(\d{1,2}\s+de\s+[A-Za-zç]+\s+de\s+\d{4})\s*$/m.exec(txt);
  d.cidade = md ? md[1].trim() : "";
  d.data   = md ? md[2].trim() : "";

  return d;
}

/** Emite o recibo individual a partir dos campos lidos. Texto de verdade,
    sem imagem e sem nenhum dado de outra pessoa — o arquivo é construído do
    zero, não recortado. O original da contabilidade continua no e-mail, que é
    de onde isto veio. */
async function reciboDeVale(PDFDocument, StandardFonts, rgb, d){
  const doc = await PDFDocument.create();
  const L = 595.28, A = 300;
  const pg = doc.addPage([L, A]);
  const normal = await doc.embedFont(StandardFonts.Helvetica);
  const forte  = await doc.embedFont(StandardFonts.HelveticaBold);
  const preto = rgb(0, 0, 0);

  const m = 40, dir = L - m;
  const texto = (t, x, y, tam = 9, f = normal) =>
    pg.drawText(String(t ?? ""), { x, y, size: tam, font: f, color: preto });
  const direita = (t, x, y, tam = 9, f = normal) =>
    texto(t, x - f.widthOfTextAtSize(String(t ?? ""), tam), y, tam, f);
  const centro = (t, y, tam = 9, f = normal) =>
    texto(t, (L - f.widthOfTextAtSize(String(t ?? ""), tam)) / 2, y, tam, f);
  const linha = (y) =>
    pg.drawLine({ start:{x:m,y}, end:{x:dir,y}, thickness:0.8, color:preto });

  const baixoCaixa = 18, topoCaixa = A - 18;
  pg.drawRectangle({ x:m, y:baixoCaixa, width:dir - m, height:topoCaixa - baixoCaixa,
                     borderWidth:0.8, borderColor:preto });

  let y = topoCaixa - 22;
  centro("RECIBO DE VALE TRANSPORTE", y, 15, forte);
  y -= 10; linha(y);

  y -= 16;
  texto("Nome:", m + 6, y, 9, forte);
  texto(`${d.codigo} - ${d.nome}`, m + 44, y);
  texto("CPF:", dir - 180, y, 9, forte);
  texto(d.cpf, dir - 152, y);
  y -= 14;
  texto("Cargo:", m + 6, y, 9, forte);
  texto(d.cargo, m + 44, y);
  texto("Depto.:", dir - 180, y, 9, forte);
  texto(d.depto, dir - 140, y);
  y -= 10; linha(y);

  const cols = [m, m + 42, m + 230, m + 320, m + 452, dir];
  const cab = ["Cód.", "Transporte", "Valor Unitário", "Quantidade X Valor dos Passes do Mês", "Valor Total"];
  y -= 14;
  cab.forEach((c, i) => {
    const meio = (cols[i] + cols[i+1]) / 2;
    texto(c, meio - forte.widthOfTextAtSize(c, 7.5) / 2, y, 7.5, forte);
  });
  y -= 6; linha(y);
  for(const t of d.transportes){
    y -= 14;
    direita(t.codigo, cols[1] - 6, y, 8);
    texto(t.nome, cols[1] + 4, y, 8);
    direita("R$ " + t.unitario, cols[3] - 6, y, 8);
    texto(t.quantidade, (cols[3] + cols[4]) / 2 - normal.widthOfTextAtSize(t.quantidade, 8) / 2, y, 8);
    direita("R$ " + t.total, dir - 6, y, 8);
    y -= 5; linha(y);
  }
  y -= 14;
  const rotulo = "Total do valor fornecido";
  const alvo = dir - 120 - m - 12;
  let pontos = "";
  while(forte.widthOfTextAtSize(rotulo + pontos + ":", 8) < alvo) pontos += ".";
  texto(rotulo + pontos + ":", m + 6, y, 8, forte);
  direita("R$ " + d.total, dir - 6, y, 8, forte);
  y -= 5; linha(y);

  y -= 18;
  const frase = `Recebi de ${d.empresa} a quantidade de Vales-Transportes acima `
    + `discriminada para minha utilização no decorrer do período de ${d.periodo}`;
  const largMax = dir - m - 24;
  let atual = "";
  for(const palavra of frase.split(" ")){
    const tenta = atual ? atual + " " + palavra : palavra;
    if(forte.widthOfTextAtSize(tenta, 8.5) > largMax){ texto(atual, m + 12, y, 8.5, forte); y -= 12; atual = palavra; }
    else atual = tenta;
  }
  if(atual) texto(atual, m + 12, y, 8.5, forte);

  y -= 16; linha(y);
  y -= 18;
  texto([d.cidade, d.data].filter(Boolean).join(", "), m + 6, y, 8.5);

  y -= 48;
  pg.drawLine({ start:{x:dir - 270, y}, end:{x:dir - 20, y}, thickness:0.8, color:preto });
  y -= 12;
  const meioAssinatura = dir - 145;
  texto(d.nome, meioAssinatura - normal.widthOfTextAtSize(d.nome, 8.5) / 2, y, 8.5);

  return doc;
}

/** Redesenha uma faixa da página em imagem. É isto que faz o pedaço do colega
    deixar de existir no arquivo, em vez de só ficar fora da moldura. */
async function faixaEmImagem(pdf, numeroPagina, r){
  const pagina = await pdf.getPage(numeroPagina);
  const escala = 200 / 72;                       // 200 dpi: legível e leve
  const viewport = pagina.getViewport({ scale: escala });
  const tela = document.createElement("canvas");
  tela.width  = Math.ceil(r.largura * escala);
  tela.height = Math.ceil(r.altura * escala);
  const ctx = tela.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, tela.width, tela.height);
  // desloca a página para que o topo da faixa caia em 0,0 do canvas
  const topo = r.baixo + r.altura;
  await pagina.render({ canvasContext: ctx, viewport,
    transform: [1, 0, 0, 1, -r.x * escala, -(r.alturaPagina - topo) * escala] }).promise;
  const dataUrl = tela.toDataURL("image/png");
  return Uint8Array.from(atob(dataUrl.split(",")[1]), c => c.charCodeAt(0));
}

    <div id="fm-lista"></div>

      `<option value="${esc(p.id)}" ${p.id===selecionado?"selected":""}>${esc(p.nome)}</option>`).join("");

  d.querySelector("#fm-analisar").onclick = async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Lendo…";
    erro.innerHTML = ""; lista.innerHTML = "";
    try {
      const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/+esm");
      pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs";

      const porChave = new Map(ativos.map(p => [chaveNome(p.nome), p.id]));
      achados = [];
      for(const [campo, especie, tipo, titulo] of [
        ["#fm-holerite", "holerite", "holerite", "Holerite"],
        ["#fm-vt", "vale_transporte", "vale_transporte", "Recibo de vale-transporte"],
      ]){
        const arq = d.querySelector(campo).files[0];
        if(!arq) continue;
        const itens = await lerConsolidado(pdfjs, arq, especie, pdfsLidos);
        itens.forEach(i => achados.push({ ...i, arquivo:arq, especie, tipo, titulo,
          employee_id: porChave.get(chaveNome(i.nome)) || "", situacao:"" }));
      }

      if(!achados.length){
        erro.innerHTML = `<div class="aviso">Não encontrei nenhum recibo nesses arquivos.
          Confira se são os PDFs da contabilidade.</div>`;
        return;
      }

      lista.innerHTML = `
        <h2 style="margin:18px 0 6px;font-size:15px">Confira antes de publicar</h2>
        <p class="sub" style="margin:0 0 8px">Nome em branco ou errado? Escolha a pessoa na lista.
          Quem ficar sem colaborador não é publicado.</p>
        ${achados.some(a => a.dados) ? `<div class="sub" style="margin:0 0 8px">
          Os recibos de vale-transporte vieram vários na mesma página. Em vez de recortar
          — o que esconderia o do colega sem apagar —, a tela <b>lê os campos e emite o
          recibo de cada um</b>, com o mesmo conteúdo e texto de verdade. O arquivo
          original da contabilidade continua no e-mail, que é a fonte.</div>` : ""}
        ${achados.some(a => a.recorte) ? `<div class="aviso">
          Em algum recibo eu não consegui ler todos os campos, então esse vai
          <b>redesenhado em imagem</b> — seguro, mas sem texto selecionável. Confira o
          arquivo depois de publicar.</div>` : ""}
        <table>
          <tr><th>Documento</th><th>Nome no PDF</th><th>Colaborador</th><th>Competência</th><th></th></tr>
          ${achados.map((a,i) => `<tr>
            <td>${esc(a.titulo)}</td>
            <td>${esc(a.nome || "não li o nome")}</td>
            <td><select data-pessoa="${i}">${opcoesDeEquipe(a.employee_id)}</select></td>
            <td><input data-comp="${i}" value="${esc(a.competencia || "")}"
                  placeholder="AAAA-MM" style="width:95px"></td>
            <td data-situacao="${i}">${a.dados
              ? `<span class="sub" style="font-size:11px">recibo emitido aqui</span>`
              : a.recorte ? `<span class="sub" style="font-size:11px">vai como imagem</span>` : ""}</td>
          </tr>`).join("")}
        </table>
        <button id="fm-publicar" style="margin-top:14px">Publicar e pedir assinatura</button>`;

      lista.querySelectorAll("[data-pessoa]").forEach(s =>
        s.onchange = () => { achados[s.dataset.pessoa].employee_id = s.value; });
      lista.querySelectorAll("[data-comp]").forEach(i =>
        i.onchange = () => { achados[i.dataset.comp].competencia = i.value.trim(); });

      lista.querySelector("#fm-publicar").onclick = (e2) => publicar(e2.target);
    } catch(e){
      erro.innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
    } finally {
      ev.target.disabled = false; ev.target.textContent = "Analisar de novo";
    }
  };

  async function publicar(botao){
    botao.disabled = true;
    const { PDFDocument, StandardFonts, rgb } =
      await import("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm");
    const prazo = d.querySelector("#fm-prazo").value || null;
    const cache = new Map();
    let publicados = 0, pulados = 0;

    for(let i = 0; i < achados.length; i++){
      const a = achados[i];
      const celula = lista.querySelector(`[data-situacao="${i}"]`);
      if(!a.employee_id){ celula.innerHTML = `<span class="etiqueta">sem colaborador</span>`; pulados++; continue; }
      celula.innerHTML = `<span class="sub">publicando…</span>`;
      try {
        let saida;
        if(a.dados){
          saida = await reciboDeVale(PDFDocument, StandardFonts, rgb, a.dados);
        } else if(a.recorte){
          saida = await PDFDocument.create();
          const png = await faixaEmImagem(pdfsLidos.get(a.arquivo), a.pagina, a.recorte);
          const imagem = await saida.embedPng(png);
          const pagina = saida.addPage([a.recorte.largura, a.recorte.altura]);
          pagina.drawImage(imagem, { x:0, y:0, width:a.recorte.largura, height:a.recorte.altura });
        } else {
          saida = await PDFDocument.create();
          if(!cache.has(a.arquivo)) cache.set(a.arquivo, await PDFDocument.load(await a.arquivo.arrayBuffer()));
          const [pagina] = await saida.copyPages(cache.get(a.arquivo), [a.pagina - 1]);
          saida.addPage(pagina);
        }
        const arquivo = await saida.saveAsBase64({ dataUri: true });

        const nomePessoa = ativos.find(p => p.id === a.employee_id)?.nome || "";
        await chamarDocs({ action:"enviar",
          employee_id: a.employee_id,
          tipo: a.tipo,
          titulo: `${a.titulo} · ${a.competencia || "sem competência"}`,
          competencia: /^\d{4}-\d{2}$/.test(a.competencia || "") ? a.competencia : undefined,
          visibilidade: "colaborador",
          exige_assinatura: true,
          prazo,
          arquivo });
        celula.innerHTML = `<span class="etiqueta ponto">publicado</span>`;
        publicados++;
        if(nomePessoa && chaveNome(nomePessoa) !== chaveNome(a.nome || "")){
          celula.innerHTML += `<div class="sub" style="font-size:11px">nome do PDF diferente do cadastro</div>`;
        }
      } catch(e){
        const jaEstava = e.dados?.duplicado;
        celula.innerHTML = jaEstava
          ? `<span class="etiqueta">já estava no sistema</span>`
          : `<span class="etiqueta grave">${esc(e.message)}</span>`;
        pulados++;
      }
    }

    erro.innerHTML = `<div class="${publicados ? "ok" : "aviso"}">${publicados} documento${
      publicados===1?"":"s"} publicado${publicados===1?"":"s"}${
      pulados ? ` · ${pulados} não ${pulados===1?"foi":"foram"}` : ""}. A pessoa assina no portal com o PIN.</div>`;
    botao.disabled = false;
    abaDocs();
  }
}

                  ${m.e_correcao ? `<span class="etiqueta correcao">correção</span>` : ""}
                  ${m.foi_corrigida ? `<span class="etiqueta substituida">substituída</span>` : ""}
                  ${m.motivo ? `<div class="sub" style="margin:2px 0 0">${esc(m.motivo)}</div>` : ""}</td>
              <td class="hora">${hora(m.occurred_at)}</td>

  document.body.appendChild(d); d.showModal();
  d.querySelector("#c-cancelar").onclick = () => d.close();
  d.addEventListener("close", () => d.remove());
  d.querySelector("#c-salvar").onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      await chamar({ action:"corrigir",
        employee_id: alvo?.employee_id || d.querySelector("#c-pessoa").value,
        kind: d.querySelector("#c-kind").value,
        occurred_at: new Date(d.querySelector("#c-quando").value).toISOString(),
        motivo: d.querySelector("#c-motivo").value,
        corrige_id: alvo?.id || null });
      d.close();
      // Lançou o ponto que faltava: roda o detector naquele dia para a
      // pendência fechar na hora, em vez de esperar a passada da madrugada.
      const dia = alvo?.dia || diaEscolhido;
      if(aba === "pend"){
        try { await chamarPend({ action:"rodar", inicio:dia, fim:dia }); } catch {}
        await atualizarSelo(); abaPendencias();
      } else {
        atualizarSelo(); abaPonto();
      }
    } catch(e){
      ev.target.disabled = false;
      d.querySelector("#c-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
    }
  };
}

      b.onclick = () => formCorrecao(CARGA[b.dataset.marcar]));
    conteudo().querySelectorAll("[data-tratar]").forEach(b =>
      b.onclick = () => formTratar(CARGA[b.dataset.tratar]));
  } catch(e){
    conteudo().innerHTML = `<div class="carta"><div class="aviso">${esc(e.message)}</div></div>`;
  }
}

// Tratar é o caminho para o que não se resolve batendo ponto: atestado, acordo
// verbal, folga trocada. O motivo é obrigatório — é ele que vira prova depois.
function formTratar(p){
  const d = document.createElement("dialog");
  d.innerHTML = `
    <form method="dialog">
      <h2 style="margin-top:0">Tratar pendência</h2>
      <p class="sub">${esc(p.nome)} — ${esc(p.detalhe)}</p>
      <label>O que foi feito</label>
      <select id="tr-situacao">
        <option value="resolvida">Resolvida — tratei por fora (atestado, acordo, folga trocada)</option>
        <option value="ignorada">Ignorar — não há o que fazer, não quero ver de novo</option>
      </select>
      <label>Motivo (fica registrado)</label>
      <input id="tr-motivo" placeholder="ex.: atestado médico entregue em 24/09">
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="tr-salvar" type="button">Registrar</button>
        <button class="secundaria" id="tr-cancelar" type="button">Cancelar</button>
      </div>
      <div id="tr-erro"></div>
    </form>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#tr-cancelar").onclick = () => { d.close(); d.remove(); };
  d.querySelector("#tr-salvar").onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      await chamarPend({ action:"resolver", id:p.id,
        situacao: d.querySelector("#tr-situacao").value,
        motivo: d.querySelector("#tr-motivo").value.trim() });
      d.close(); d.remove(); await atualizarSelo(); abaPendencias();
    } catch(e){
      ev.target.disabled = false;
      d.querySelector("#tr-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
    }
  };
}

/* ---------- escala, folgas e feriados ---------- */
const DIAS_SEMANA = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

async function abaEscala(){
  conteudo().innerHTML = `<div class="carta"><p class="vazio">Carregando…</p></div>`;
  try {
    const [{ equipe }, { escala, excecoes }, { feriados }, { unidade:uni }] = await Promise.all([
      chamar({ action:"equipe" }),
      chamarPend({ action:"escala_listar" }),
      chamarPend({ action:"feriados_listar", desde: hojeLocal() }),
      chamarPend({ action:"unidade_ler" }),
    ]);
    const gente = equipe.filter(p => p.registra_ponto);
    const porPessoa = new Map();
    escala.forEach(e => {
      const l = porPessoa.get(e.employee_id) ?? [];
      l.push(e); porPessoa.set(e.employee_id, l);
    });

    conteudo().innerHTML = `
      <div class="carta">
        <h2 style="margin-top:0">Escala da semana</h2>
        <p class="sub">É a escala que diz ao sistema o que é falta e o que é folga.
          Sem ela, dia sem marcação passa em branco.</p>
        ${gente.length ? `<table>
          <tr><th>Quem</th>${DIAS_SEMANA.map(d => `<th>${d.slice(0,3)}</th>`).join("")}<th></th></tr>
          ${gente.map(p => {
            const linhas = porPessoa.get(p.id) ?? [];
            return `<tr>
              <td>${esc(p.nome)}</td>
              ${DIAS_SEMANA.map((_,i) => {
                const e = linhas.find(l => l.dia_semana === i);
                return `<td style="font-size:12px">${
                  !e ? `<span style="color:#b9b4a8">—</span>`
                  : e.folga ? `<span class="etiqueta">folga</span>`
                  : `${e.entrada.slice(0,5)}<br>${e.saida.slice(0,5)}`}</td>`;
              }).join("")}
              <td><button class="discreto" data-semana='${guarde(
                {id:p.id, nome:p.nome})}'>editar</button></td></tr>`;
          }).join("")}
        </table>` : `<p class="vazio">Ninguém registra ponto nesta unidade.</p>`}
      </div>

      <div class="carta">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 style="margin:0">Exceções de um dia</h2>
          <button class="secundaria" id="es-excecao">Lançar exceção</button>
        </div>
        <p class="sub">Folga trocada, dia extra, horário diferente. A exceção vence a escala da semana.</p>
        ${excecoes.length ? `<table>
          <tr><th>Dia</th><th>Quem</th><th>O que é</th><th></th></tr>
          ${excecoes.map(e => `<tr>
            <td class="hora">${e.data.slice(8)}/${e.data.slice(5,7)}</td>
            <td>${esc(e.nome)}</td>
            <td>${e.folga ? `<span class="etiqueta">folga</span>`
                 : `${e.entrada.slice(0,5)} às ${e.saida.slice(0,5)}`}
                ${e.observacao ? `<div style="font-size:12px;color:#7a7568">${esc(e.observacao)}</div>` : ""}</td>
            <td><button class="discreto" data-apagar="${esc(e.id)}">apagar</button></td></tr>`).join("")}
        </table>` : `<p class="vazio">Nenhuma exceção daqui para frente.</p>`}
      </div>

      <div class="carta">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 style="margin:0">Feriados</h2>
          <button class="secundaria" id="es-feriado">Incluir feriado</button>
        </div>
        <p class="sub">Marque "fecha" nos feriados em que o pub não abre — nesses dias ninguém é
          cobrado por falta, e quem trabalhar entra como pendência para você conferir o pagamento.</p>
        ${feriados.length ? `<table>
          <tr><th>Dia</th><th>Feriado</th><th>Tipo</th><th>Pub</th></tr>
          ${feriados.slice(0,14).map(f => `<tr>
            <td class="hora">${f.data.slice(8)}/${f.data.slice(5,7)}</td>
            <td>${esc(f.nome)}${f.observacao ? `<div style="font-size:12px;color:#7a7568">${esc(f.observacao)}</div>` : ""}</td>
            <td style="font-size:12px">${esc(f.tipo)}</td>
            <td><button class="discreto" data-abre='${guarde(f)}'>${
              f.abre ? "abre" : "fecha"}</button></td></tr>`).join("")}
        </table>` : `<p class="vazio">Nenhum feriado cadastrado.</p>`}
      </div>

      <div class="carta">
        <h2 style="margin-top:0">Ponto pelo celular</h2>
        <p class="sub">Enquanto estiver desligado, o ponto só é batido no tablet do salão.
          Ligando, a marcação pelo celular só é aceita dentro do raio marcado — e a distância
          fica registrada em toda marcação, dentro ou fora.</p>
        <div class="linha">
          <div><label>Latitude</label><input id="ce-lat" value="${uni?.latitude ?? ""}" placeholder="—"></div>
          <div><label>Longitude</label><input id="ce-lon" value="${uni?.longitude ?? ""}" placeholder="—"></div>
          <div><label>Raio (metros)</label><input type="number" id="ce-raio" value="${uni?.raio_ponto_m ?? 150}"></div>
          <button class="secundaria" id="ce-aqui">Usar onde estou</button>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px">
          <input type="checkbox" id="ce-liberar" style="width:auto" ${uni?.ponto_celular ? "checked" : ""}>
          Liberar o ponto pelo celular nesta unidade</label>
        <div style="margin-top:12px"><button id="ce-salvar">Salvar</button></div>
        <div id="ce-erro"></div>
      </div>`;

    conteudo().querySelectorAll("[data-semana]").forEach(b =>
      b.onclick = () => formSemana(CARGA[b.dataset.semana], porPessoa.get(CARGA[b.dataset.semana].id) ?? []));
    conteudo().querySelectorAll("[data-apagar]").forEach(b =>
      b.onclick = async () => {
        try { await chamarPend({ action:"escala_apagar", id:b.dataset.apagar }); abaEscala(); }
        catch(e){ alert(e.message); }
      });
    conteudo().querySelectorAll("[data-abre]").forEach(b =>
      b.onclick = async () => {
        const f = CARGA[b.dataset.abre];
        try { await chamarPend({ action:"feriado_salvar", ...f, abre: !f.abre }); abaEscala(); }
        catch(e){ alert(e.message); }
      });
    document.getElementById("es-excecao").onclick = () => formExcecao(gente);
    document.getElementById("es-feriado").onclick = () => formFeriado();

    document.getElementById("ce-aqui").onclick = (ev) => {
      if(!navigator.geolocation) return alert("Este navegador não informa a localização.");
      ev.target.disabled = true; ev.target.textContent = "Lendo…";
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById("ce-lat").value = pos.coords.latitude.toFixed(6);
        document.getElementById("ce-lon").value = pos.coords.longitude.toFixed(6);
        ev.target.disabled = false; ev.target.textContent = "Usar onde estou";
      }, () => {
        ev.target.disabled = false; ev.target.textContent = "Usar onde estou";
        document.getElementById("ce-erro").innerHTML =
          `<div class="aviso">Não conseguimos ler a localização. Faça isso no celular, dentro do pub.</div>`;
      }, { enableHighAccuracy:true, timeout:12000 });
    };
    document.getElementById("ce-salvar").onclick = async (ev) => {
      ev.target.disabled = true;
      try {
        await chamarPend({ action:"unidade_salvar",
          latitude: document.getElementById("ce-lat").value.trim(),
          longitude: document.getElementById("ce-lon").value.trim(),
          raio_ponto_m: document.getElementById("ce-raio").value,
          ponto_celular: document.getElementById("ce-liberar").checked });
        abaEscala();
      } catch(e){
        ev.target.disabled = false;
        document.getElementById("ce-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
      }
    };
  } catch(e){
    conteudo().innerHTML = `<div class="carta"><div class="aviso">${esc(e.message)}</div></div>`;
  }
}

function formSemana(pessoa, atual){
  const d = document.createElement("dialog");
  d.style.maxWidth = "560px";
  d.innerHTML = `
    <form method="dialog">
      <h2 style="margin-top:0">Escala de ${esc(pessoa.nome)}</h2>

      <input type="date" id="sm-vigencia" value="${hojeLocal()}">
      <table style="margin-top:12px">
        <tr><th>Dia</th><th>Folga</th><th>Entrada</th><th>Início intervalo</th><th>Retorno</th><th>Saída</th></tr>
        ${DIAS_SEMANA.map((nome,i) => {
          const e = atual.find(l => l.dia_semana === i);
          return `<tr>
            <td>${nome}</td>
            <td><input type="checkbox" data-folga="${i}" style="width:auto" ${
              e?.folga || !e ? "checked" : ""}></td>
            <td><input type="time" data-entrada="${i}" value="${e?.entrada?.slice(0,5) ?? "17:00"}"></td>
            <td><input type="time" data-intinicio="${i}" value="${e?.intervalo_inicio?.slice(0,5) ?? ""}"></td>
            <td><input type="time" data-intfim="${i}" value="${e?.intervalo_fim?.slice(0,5) ?? ""}"></td>
            <td><input type="time" data-saida="${i}" value="${e?.saida?.slice(0,5) ?? "23:00"}"></td>
          </tr>`;
        }).join("")}
      </table>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="sm-salvar" type="button">Salvar escala</button>
        <button class="secundaria" id="sm-cancelar" type="button">Cancelar</button>
      </div>
      <div id="sm-erro"></div>
    </form>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#sm-cancelar").onclick = () => { d.close(); d.remove(); };
  d.querySelector("#sm-salvar").onclick = async (ev) => {
    ev.target.disabled = true;
    const dias = DIAS_SEMANA.map((_,i) => ({
      dia_semana: i,
      folga: d.querySelector(`[data-folga="${i}"]`).checked,
      entrada: d.querySelector(`[data-entrada="${i}"]`).value,
      saida: d.querySelector(`[data-saida="${i}"]`).value,
      intervalo_inicio: d.querySelector(`[data-intinicio="${i}"]`).value || null,
      intervalo_fim: d.querySelector(`[data-intfim="${i}"]`).value || null,
      intervalo_min: duracaoIntervalo(d.querySelector(`[data-intinicio="${i}"]`).value,d.querySelector(`[data-intfim="${i}"]`).value),
    }));
    try {
      await chamarPend({ action:"escala_semana", employee_id: pessoa.id, dias,
        vigencia_inicio: d.querySelector("#sm-vigencia").value });
      d.close(); d.remove(); abaEscala();
    } catch(e){
      ev.target.disabled = false;
      d.querySelector("#sm-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
    }
  };
}

function duracaoIntervalo(inicio,fim){
  if(!inicio || !fim)return null;
  const min=h=>Number(h.slice(0,2))*60+Number(h.slice(3,5));
  let dur=min(fim)-min(inicio);if(dur<0)dur+=1440;
  return dur;
}

/* Converte a aba FUNÇÃO da planilha de escala no texto que a equipe lê.
   A planilha chega colada como TSV: a primeira linha traz os dias de três em
   três colunas, a segunda os rótulos, e o resto são as pessoas. Nada é
   inventado — célula vazia some, e pessoa sem horário aparece com "horário a
   definir", para o buraco ficar visível em vez de passar batido. */
function escalaDaPlanilha(bruto){
  const linhas = String(bruto).replace(/\r/g, "").split("\n").map(l => l.split("\t"));
  if(linhas.length < 3) return "";

  const dias = linhas[0].map((c, i) => [String(c).trim(), i]).filter(([c]) => c);
  if(!dias.length) return "";

  const corpo = /pessoa/i.test((linhas[1] || []).join(" ")) ? linhas.slice(2) : linhas.slice(1);

  const blocos = [];
  for(const [titulo, col] of dias){
    const gente = [];
    for(const l of corpo){
      const nome = String(l[col] ?? "").trim();
      if(!nome) continue;
      gente.push({ nome, hora: String(l[col+1] ?? "").trim(), funcao: String(l[col+2] ?? "").trim() });
    }
    if(gente.length) blocos.push({ titulo, gente });
  }
  if(!blocos.length) return "";

  return blocos.map(b => {
    const larg = Math.max(...b.gente.map(g => g.nome.length));
    return b.titulo + "\n" + b.gente.map(g => {
      let linha = "  " + g.nome.padEnd(larg) + "  " + (g.hora || "horário a definir");
      if(g.funcao) linha += "  ·  " + g.funcao;
      return linha;
    }).join("\n");
  }).join("\n\n");
}

// O painel responde, nesta ordem: o que está não conforme agora, o que não foi
// feito, e o que repete. Nota ao longo do tempo só depois que houver histórico —
// antes disso é gráfico bonito sem conteúdo.
const SITUACAO_EXEC = { em_andamento:"em andamento", concluida:"concluído",
  em_revisao:"esperando revisão", aprovada:"aprovado", reprovada:"reprovado" };

async function chamarChk(payload){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) { telaLogin("Sua sessão expirou. Entre de novo."); throw new Error("sem sessão"); }
  const r = await fetch(`${URL_SB}/functions/v1/checklists`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify({ unit_token: unidade?.public_token, ...payload })
  });
  const d = await r.json().catch(()=>({error:"Resposta inválida."}));
  if(!r.ok) { const e = new Error(d.error || "Não foi possível completar."); e.dados = d; throw e; }
  return d;
}

  d.innerHTML = `

  document.body.appendChild(d); d.showModal();

  d.addEventListener("close", () => d.remove());
  chamarChk({action:"detalhar",id:e.id}).then(r=>{

    const corpo=r.modelo?.corpo||{};
    const itens=(corpo.grupos||[]).flatMap(g=>g.itens||[]);
    d.style.maxWidth="800px";
    d.querySelector("#rv-respostas").innerHTML=`<p class="sub">${esc(r.execucao.business_date)} · ${esc(r.execucao.turno||"")}</p>${Object.entries(r.execucao.contexto||{}).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join("")}<table><tr><th>Item</th><th>Resposta</th><th>Evidência</th></tr>${itens.map(i=>{const rs=r.respostas.filter(x=>x.item_id===i.id);return `<tr><td>${esc(i.texto)}</td><td>${rs.length?rs.map(x=>`${esc(x.nao_aplicavel?"Não aplicável":valor(x.valor))}${x.observacao?"<br>"+esc(x.observacao):""}`).join("<br>"):"Pendente"}</td><td>${rs.map(x=>x.foto_url?.startsWith(URL_SB+"/storage/")?`<a href="${esc(x.foto_url)}" target="_blank" rel="noopener noreferrer">Ver foto</a>`:x.evidencia_path?"Foto indisponível agora":"—").join("<br>")}</td></tr>`;}).join("")}</table>${r.execucao.observacoes?`<p>${esc(r.execucao.observacoes)}</p>`:""}${r.revisoes.length?`<p class="sub">Revisões anteriores: ${r.revisoes.map(v=>esc((v.aprovado?"Aprovado":"Reprovado")+" · "+(v.motivo||""))).join("; ")}</p>`:""}`;
    d.querySelector("#rv-ok").disabled=false;d.querySelector("#rv-nao").disabled=false;
  }).catch(err=>{if(d.isConnected)d.querySelector("#rv-respostas").textContent=err.message;});
  const decidir = async (aprovar, botao) => {
    botao.disabled = true;
    try {
      await chamarChk({ action:"revisar", id:e.id, aprovar,
        motivo: d.querySelector("#rv-motivo").value });
      d.close(); abaChecklists();
    } catch(err){
      botao.disabled = false;
      d.querySelector("#rv-erro").innerHTML = `<div class="aviso">${esc(err.message)}</div>`;
    }
  };
  d.querySelector("#rv-ok").onclick = (ev) => decidir(true, ev.target);
  d.querySelector("#rv-nao").onclick = (ev) => decidir(false, ev.target);
}

// Mes fechado por padrao: do dia 1 ao ultimo dia do mes corrente.
function mesAtual(){
  const hoje = hojeLocal();
  const [a,m] = hoje.split("-").map(Number);
  const ultimo = new Date(Date.UTC(a, m, 0)).getUTCDate();
  return { inicio:`${hoje.slice(0,7)}-01`, fim:`${hoje.slice(0,7)}-${String(ultimo).padStart(2,"0")}` };
}

function tabelaPlanilhaSegura(XLSX, planilha){
  const linhas = XLSX.utils.sheet_to_json(planilha, { header:1, raw:false, defval:"", blankrows:true });
  if(linhas.length > 500 || linhas.some(l=>l.length > 50)) throw new Error("Planilha muito grande para esta visualização (até 500 linhas e 50 colunas).");
  const colunas = Math.max(1,...linhas.map(l=>l.length));
  const mescladas=new Map(), cobertas=new Set();
  for(const m of planilha["!merges"] ?? []){
    if(m.s.r<0 || m.s.c<0 || m.e.r>=linhas.length || m.e.c>=colunas)continue;
    mescladas.set(`${m.s.r}:${m.s.c}`,{linhas:m.e.r-m.s.r+1,colunas:m.e.c-m.s.c+1});
    for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)if(r!==m.s.r || c!==m.s.c)cobertas.add(`${r}:${c}`);
  }
  return `<table style="min-width:1400px;font-size:12px"><tbody>${linhas.map((linha,i)=>
    `<tr style="${i===0 ? "font-weight:700;background:#e6efe9" : ""}">${Array.from({length:colunas},(_,j)=>{
      if(cobertas.has(`${i}:${j}`))return "";
      const m=mescladas.get(`${i}:${j}`);
      return `<td ${m ? `rowspan="${m.linhas}" colspan="${m.colunas}"` : ""} style="white-space:pre-wrap;min-width:70px">${esc(linha[j] ?? "")}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>`;
}

    <label for="xp-aba">Aba da planilha</label><select id="xp-aba" disabled></select>
    <p class="sub">Visualização para conferência: fórmulas não são recalculadas. Valores de horas, adicionais e fechamento devem ser conferidos com as regras aplicáveis.</p>
    <div id="xp-erro" role="status"></div><div id="xp-tabela" style="overflow:auto;max-height:60vh"></div>
    <button class="secundaria" id="xp-fechar" style="margin-top:14px">Fechar</button>`;
  document.body.appendChild(d);d.showModal();
  let livro=null, biblioteca=null;
  const seletor=d.querySelector("#xp-aba"), saida=d.querySelector("#xp-tabela"), erro=d.querySelector("#xp-erro");
  d.querySelector("#xp-fechar").onclick=()=>d.close();
  d.addEventListener("close",()=>{livro=null;biblioteca=null;d.remove();});
  const desenhar=()=>{try{saida.innerHTML=tabelaPlanilhaSegura(biblioteca,livro.Sheets[seletor.value]);}
    catch(e){saida.innerHTML="";erro.textContent=e.message;}};
  seletor.onchange=desenhar;
  d.querySelector("#xp-arquivo").onchange=async(e)=>{
    livro=null;saida.innerHTML="";seletor.innerHTML="";seletor.disabled=true;
    const arquivo=e.target.files[0];if(!arquivo)return;
    try{
      if(!arquivo.name.toLowerCase().endsWith(".xlsx") || arquivo.size>5*1024*1024) throw new Error("Escolha um .xlsx de até 5 MB.");
      erro.textContent="Lendo a planilha…";
      biblioteca=await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
      livro=biblioteca.read(await arquivo.arrayBuffer(),{type:"array",cellFormula:false,sheetRows:501});
      if(!d.isConnected)return;
      if(!livro.SheetNames.length)throw new Error("Nenhuma aba encontrada.");
      seletor.innerHTML=livro.SheetNames.map(nome=>`<option value="${esc(nome)}">${esc(nome)}</option>`).join("");
      seletor.disabled=false;erro.textContent="Arquivo aberto para conferência. Nenhum lançamento foi feito.";desenhar();
    }catch(err){erro.textContent=err.message || "Não foi possível ler o arquivo.";}
  };
}

function desenharFolha(r){
  const { dias, resumo, jornada, colaborador } = r;
  const aviso = resumo.parametros_confirmados ? "" :
    `<div class="aviso" style="margin-bottom:12px">Percentuais e convenção ainda pendentes de confirmação. A conferência mostra horas; não calcula pagamento nem aplica desconto automático.</div>`;

  document.getElementById("fp-saida").innerHTML = `
    ${aviso}
    <p class="sub" style="margin-top:0">${esc(colaborador.nome)}${esc(colaborador.cargo ? " — "+colaborador.cargo : "")}
      · jornada por escala e vigência · previsto no período: ${esc(resumo.esperado ?? "pendente")}</p>
    ${resumo.bloqueios?.length ? `<div class="aviso"><b>Fechamento pendente</b><ul>${resumo.bloqueios.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
    <div style="overflow-x:auto">
    <table>
      <tr><th>Data</th><th>1ª Ent.</th><th>1ª Saí.</th><th>2ª Ent.</th><th>2ª Saí.</th>
          <th>Interv.</th><th>Trabalhado</th><th>Normais</th><th>Extras</th><th>Débito</th><th>H.E. 1</th><th>H.E. 2</th><th>Noturno</th><th>Observação</th></tr>
      ${dias.map(d => `<tr style="${d.observacao.includes("conferir") ? "background:#fdf4ec" : ""}">
        <td>${esc(d.rotulo)}</td>
        <td class="hora">${d.e1}</td><td class="hora">${d.s1}</td>
        <td class="hora">${d.e2}</td><td class="hora">${d.s2}</td>
        <td class="hora">${d.intervalo}</td><td class="hora">${d.trabalhado}</td>
        <td class="hora">${esc(d.normais??"—")}</td><td class="hora">${d.extra}</td><td class="hora">${d.debito}</td><td class="hora">${esc(d.he1??"—")}</td><td class="hora">${esc(d.he2??"—")}</td><td class="hora">${d.noturno}</td>
        <td style="font-size:12px;color:#7a7568">${esc(d.observacao)}</td></tr>`).join("")}
      <tr style="font-weight:700;background:#f2f1ec">
        <td>Totais</td><td colspan="4"></td>
        <td class="hora">${resumo.intervalo}</td><td class="hora">${resumo.trabalhado}</td>
        <td class="hora">${esc(resumo.normais??"—")}</td><td class="hora">${resumo.extras}</td><td class="hora">${resumo.debito}</td><td class="hora">${esc(resumo.he1??"—")}</td><td class="hora">${esc(resumo.he2??"—")}</td>
        <td class="hora">${resumo.noturno}</td><td></td></tr>
    </table>
    </div>
    ${resumo.hora_noturna_reduzida && resumo.noturno !== "0:00"
      ? `<p class="sub">Com a hora noturna reduzida (art. 73 § 1º da CLT), ${resumo.noturno} de relógio
         valem ${resumo.noturno_reduzido} para pagamento.</p>` : ""}
    <p class="sub">Sem tolerância: extras ${esc(resumo.extras_sem_tolerancia??"—")} · débito ${esc(resumo.debito_sem_tolerancia??"—")}. A diferença completa permanece disponível para conferência.</p>
    <label><input type="checkbox" id="fp-conferido" style="width:auto"> Conferi as batidas, ocorrências e regras deste período</label>
    <div style="margin-top:14px"><button id="fp-pdf" ${resumo.pode_fechar ? "" : "disabled"}>Gerar PDF e enviar para assinatura</button></div>
    <div id="fp-resultado"></div>`;

  document.getElementById("fp-pdf").onclick = async (ev) => {
    if(!document.getElementById("fp-conferido").checked){document.getElementById("fp-resultado").textContent="Confirme a conferência antes de publicar.";return;}
    ev.target.disabled = true;
    const caixa = document.getElementById("fp-resultado");
    caixa.innerHTML = `<p class="vazio">Gerando…</p>`;
    try {
      const g = await chamarFolha({ action:"folha_pdf", ...folhaFiltro, confirmado:true });
      caixa.innerHTML = `<p class="sub">Folha gerada e publicada para assinatura no portal do
        colaborador. Selo do arquivo: <code>${esc(g.sha256_curto)}</code>. Ela aparece na aba Documentos.</p>`;
    } catch(e){
      caixa.innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
      ev.target.disabled = false;
    }
  };
}

function formParametros(){
  const d = document.createElement("dialog");
  d.innerHTML = `
    <form method="dialog" style="min-width:min(520px,92vw)">
      <h2 style="margin-top:0">Percentuais e tolerância</h2>
      <p class="sub">Salvar cria uma vigência nova. As folhas já geradas continuam com os
        percentuais da época — não são reescritas.</p>
      <div id="pa-corpo"><p class="vazio">Carregando…</p></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="pa-salvar" type="button">Salvar</button>
        <button class="secundaria" id="pa-fechar" type="button">Fechar</button>
      </div>
      <div id="pa-erro"></div>
    </form>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#pa-fechar").onclick = () => { d.close(); d.remove(); };

  chamarFolha({ action:"parametros" }).then(({ parametros:p }) => {
    d.querySelector("#pa-corpo").innerHTML = `
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><label>Hora extra (%)</label>
          <input type="number" step="1" id="pa-he" value="${p?.confirmados ? p.he_percentual : ""}" placeholder="a confirmar"></div>
        <div style="flex:1;min-width:150px"><label>Hora extra 2ª faixa (%)</label>
          <input type="number" step="1" id="pa-he2" value="${p?.confirmados ? (p.he_percentual_2 ?? "") : ""}" placeholder="a confirmar"></div>
        <div style="flex:1;min-width:150px"><label>Adicional noturno (%)</label>
          <input type="number" step="1" id="pa-not" value="${p?.confirmados ? p.noturno_percentual : ""}" placeholder="a confirmar"></div>
        <div style="flex:1;min-width:150px"><label>Noturno começa às</label>
          <input type="time" id="pa-notini" value="22:00" readonly></div>
        <div style="flex:1;min-width:150px"><label>Tolerância por dia (min)</label>
          <input type="number" step="1" id="pa-tol" value="10" readonly></div>
        <div style="flex:1;min-width:150px"><label>Vigência a partir de</label>
          <input type="date" id="pa-vig" value="${hojeLocal()}"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <input type="checkbox" id="pa-red" checked disabled>
        Hora noturna reduzida (52min30 contam como 1h)</label>
      <label>Convenção aplicada</label>
      <input id="pa-conv" value="${esc(p?.confirmados ?? "")}" placeholder="ex.: CCT SINTHORESP x SINDRESBAR 2025/2027">
      <label><input type="checkbox" id="pa-confirmados" style="width:auto"> Confirmei estes percentuais e a convenção com a contabilidade</label>
      <label>Observação</label>
      <input id="pa-obs" value="${esc(p?.observacao ?? "")}" placeholder="de onde veio esse número">`;

    d.querySelector("#pa-salvar").onclick = async (ev) => {
      ev.target.disabled = true;
      try {
        await chamarFolha({ action:"salvar_parametros",
          confirmados: d.querySelector("#pa-confirmados").checked,
          vigencia_inicio: d.querySelector("#pa-vig").value,
          he_percentual: d.querySelector("#pa-he").value,
          he_percentual_2: d.querySelector("#pa-he2").value || null,
          noturno_percentual: d.querySelector("#pa-not").value,
          noturno_inicio: d.querySelector("#pa-notini").value,
          hora_noturna_reduzida: d.querySelector("#pa-red").checked,
          tolerancia_dia_min: d.querySelector("#pa-tol").value,
          convencao: d.querySelector("#pa-conv").value.trim() || null,
          observacao: d.querySelector("#pa-obs").value.trim() || null });
        d.close(); d.remove(); abaFolha();
      } catch(e){
        ev.target.disabled = false;
        d.querySelector("#pa-erro").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
      }
    };
  }).catch(e => {
    d.querySelector("#pa-corpo").innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
  });
}

/* ---------- importar modelos de documento ---------- */
// Os arquivos .json ficam na pasta modelos/ do repositorio. Sobem daqui, do
// navegador, para nao empurrar centenas de KB por outro caminho.
function formModelos(){
  const d = document.createElement("dialog");
  d.innerHTML = `
    <form method="dialog" style="min-width:min(560px,92vw)">
      <h2 style="margin-top:0">Importar modelos</h2>
      <p class="sub">Escolha os arquivos <code>.json</code> da pasta <code>modelos/</code>.
        Cada importação cria uma versão nova e desativa a anterior. Modelo com campo
        <code>[[pendente]]</code> entra desativado até você revisar.</p>
      <input type="file" id="mo-arquivos" accept=".json,application/json" multiple>
      <div id="mo-lista"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="mo-enviar" type="button">Importar</button>
        <button class="secundaria" id="mo-fechar" type="button">Fechar</button>
      </div>
      <div id="mo-erro"></div>
    </form>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector("#mo-fechar").onclick = () => { d.close(); d.remove(); };

  d.querySelector("#mo-enviar").onclick = async (ev) => {
    const arquivos = [...(d.querySelector("#mo-arquivos").files || [])];
    const erro = d.querySelector("#mo-erro");
    if(!arquivos.length){ erro.innerHTML = `<div class="aviso">Escolha ao menos um arquivo.</div>`; return; }
    ev.target.disabled = true; erro.innerHTML = "";
    d.querySelector("#mo-lista").innerHTML = `<p class="vazio">Lendo ${arquivos.length} arquivo(s)…</p>`;
    try {
      const modelos = [];
      for(const a of arquivos){
        try { modelos.push(JSON.parse(await a.text())); }
        catch { throw new Error(`O arquivo ${esc(a.name)} não é um JSON válido.`); }
      }
      const r = await chamarModelos({ action:"importar", modelos });
      d.querySelector("#mo-lista").innerHTML = `
        <p class="sub" style="margin-bottom:6px">${r.importados} importado(s), ${r.ativos} ativo(s).</p>
        <table style="margin-top:4px">
          <tr><th>Código</th><th>Título</th><th>Versão</th><th>Situação</th></tr>
          ${(r.relatorio || []).map(m => `<tr>
            <td>${esc(m.codigo)}</td><td>${esc(m.titulo ?? "")}</td><td>${esc(m.versao ?? "")}</td>
            <td>${esc(m.situacao)}${m.motivo ? ` — ${esc(m.motivo)}` : ""}</td></tr>`).join("")}
        </table>`;
      ev.target.disabled = false;
    } catch(e){
      d.querySelector("#mo-lista").innerHTML = "";
      erro.innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
      ev.target.disabled = false;
    }
  };
}
