<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fechamento da cozinha · Feitoria</title><style>
:root{--verde:#1f4d3a;--borda:#dfe4da;--suave:#657165}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#233b30;font:15px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:26px;margin:0}h2{font-size:19px}.sub,small{color:var(--suave)}.panel{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px;margin:15px 0}button{font:inherit;background:var(--verde);color:#fff;padding:11px 15px;border:0;border-radius:9px;cursor:pointer;min-height:44px}button:disabled{opacity:.5}a{color:var(--verde)}.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--borda)}th{font-size:12px;color:var(--suave)}.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.galeria img{width:100%;max-height:320px;object-fit:contain;background:#f5f3ec;border-radius:10px}figure{margin:0}figcaption{font-size:13px}.erro{color:#922f24}.nota{white-space:pre-wrap}:focus-visible{outline:3px solid #c8871f;outline-offset:2px}@media(max-width:600px){main{padding:10px}.panel{padding:12px}}
</style></head><body><main><div class="linha"><h1>Fechamento da cozinha</h1><button id="atualizar">Atualizar</button></div><p class="sub">Os mesmos registros do portal do funcionário: etiquetas, perdas, sobras, observações e fotos do turno.</p><p id="status" role="status" aria-live="polite"></p><section id="historico" class="panel"></section><section id="relatorio"></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ';
const sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id'),el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dia=x=>String(x??'').split('-').reverse().join('/'),dh=x=>x?new Date(x).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Em andamento';
const destino={consumido:'Consumido',sobra:'Sobra',vencido:'Vencido',quebra:'Quebra',revalidado:'Revalidado',outro:'Outro'};
let busy=false,current=null,generation=0;
function mensagem(t,erro=false){el('status').textContent=t;el('status').className=erro?'erro':'';}
async function call(acao,p={}){
 const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Entre no portal de gestão para consultar os fechamentos.');
 const r=await fetch(SB+'/functions/v1/gestao-cozinha',{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...p})});
 const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível consultar.');return d;
}
async function executar(f){if(busy)return;busy=true;el('atualizar').disabled=true;const g=generation;try{await f(g);}catch(e){if(g===generation)mensagem(e.message,true);}finally{busy=false;el('atualizar').disabled=false;}}
async function carregar(g){
 mensagem('Consultando fechamentos…');el('relatorio').replaceChildren();const d=await call('historico');if(g!==generation)return;
 el('historico').innerHTML='<h2>Últimos '+d.limite+' fechamentos</h2>'+(d.fechamentos.length?'<div class="scroll"><table><thead><tr><th>Dia</th><th>Situação</th><th>Responsável</th><th>Baixas</th><th>Fotos</th><th></th></tr></thead><tbody>'+d.fechamentos.map(x=>'<tr><td>'+esc(dia(x.dia))+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.closed_by_name||'Em andamento')+'</td><td>'+esc(x.baixas)+'</td><td>'+esc(x.fotos)+'</td><td><button data-id="'+esc(x.closure_id)+'">Ver relatório e fotos</button></td></tr>').join('')+'</tbody></table></div>':'<p class="sub">Nenhum fechamento registrado nesta unidade.</p>');
 for(const b of document.querySelectorAll('[data-id]'))b.onclick=()=>executar(g=>abrir(b.dataset.id,g));mensagem('Consulta concluída.');
}
async function abrir(id,g){
 mensagem('Abrindo relatório…');el('relatorio').replaceChildren();const d=await call('relatorio',{closure_id:id});if(g!==generation)return;current=id;
 const r=d.resumo;el('relatorio').innerHTML='<div class="panel"><h2>'+esc(dia(r.dia))+' · '+esc(r.status)+'</h2><p>'+esc(r.closed_by_name||r.opened_by_name)+' · '+esc(dh(r.closed_at))+'</p><p><strong>'+esc(r.baixas)+' etiquetas</strong> · '+esc(Number(r.vencidos||0)+Number(r.quebras||0))+' perdas · '+esc(r.sobras)+' sobras · '+esc(r.consumidos)+' consumidas · '+esc(r.revalidados)+' revalidadas</p><p class="sub">As quantidades abaixo descrevem o fechamento. Não são novas movimentações do estoque da Takeat.</p><h3>Observação</h3><p class="nota">'+esc(r.nota||'Sem observação.')+'</p><div class="scroll"><table><thead><tr><th>Destino</th><th>Produto</th><th>Etiquetas</th><th>Quantidade</th></tr></thead><tbody>'+d.linhas.map(x=>'<tr><td>'+esc(destino[x.outcome]||x.outcome)+'</td><td>'+esc(x.product_name)+'<br><small>'+esc(x.storage_method)+'</small></td><td>'+esc(x.etiquetas)+'</td><td>'+esc(x.quantidade??'Não informada')+' '+esc(x.unidade)+'</td></tr>').join('')+'</tbody></table></div><h3>Fotos do fechamento</h3><p class="sub">Acesso privado. Os links expiram em cinco minutos; atualize o relatório para reabrir.</p><button id="reabrir">Atualizar relatório e fotos</button><div class="galeria">'+d.fotos.map(f=>'<figure><a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+esc(f.url)+'" alt="'+esc(f.tipo==='lixeira'?'Foto da lixeira':'Foto do fechamento')+'"></a><figcaption>'+esc(f.legenda||f.tipo)+' · '+esc(f.employee_name)+'<br>'+esc(dh(f.created_at))+'</figcaption></figure>').join('')+'</div></div>';
 el('reabrir').onclick=()=>executar(g=>abrir(current,g));mensagem('Relatório aberto. Fotos disponíveis somente após conferir seu acesso.');
}
sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){generation++;el('historico').replaceChildren();el('relatorio').replaceChildren();mensagem('Sessão encerrada. Entre novamente na gestão.',true);}});
el('atualizar').onclick=()=>executar(carregar);if(unit)executar(carregar);else mensagem('Abra este módulo pelo portal de gestão.',true);
</script></body></html>
