<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fechamento da cozinha · Feitoria</title><style>

:root{--verde:#1f4d3a;--borda:#dfe4da;--suave:#657165}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#233b30;font:15px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:26px;margin:0}h2{font-size:19px}.sub,small{color:var(--suave)}.panel{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px;margin:15px 0}button{font:inherit;background:var(--verde);color:#fff;padding:11px 15px;border:0;border-radius:9px;cursor:pointer;min-height:44px}button:disabled{opacity:.5}a{color:var(--verde)}select,textarea{display:block;width:100%;font:inherit;padding:10px;margin:6px 0 12px;border:1px solid var(--borda);border-radius:8px}textarea{min-height:70px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--borda)}th{font-size:12px;color:var(--suave)}.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.galeria img{width:100%;max-height:320px;object-fit:contain;background:#f5f3ec;border-radius:10px}figure{margin:0}figcaption{font-size:13px}.erro{color:#922f24}.nota{white-space:pre-wrap}:focus-visible{outline:3px solid #c8871f;outline-offset:2px}@media(max-width:600px){main{padding:10px}.panel{padding:12px}}

</style></head><body><main><div class="linha"><h1>Cozinha</h1><button id="atualizar">Atualizar</button></div><p class="sub">Fechamentos do turno e produções registradas pela equipe.</p><p id="status" role="status" aria-live="polite"></p><section id="piloto" class="panel"></section><section id="historico" class="panel"></section><section id="producoes" class="panel"></section><section id="relatorio"></section></main><script type="module">

import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';

const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ';

const sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id'),el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dia=x=>String(x??'').split('-').reverse().join('/'),dh=x=>x?new Date(x).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Em andamento';

const destino={consumido:'Consumido',sobra:'Sobra',vencido:'Vencido',quebra:'Quebra',revalidado:'Revalidado',outro:'Outro'};

let busy=false,current=null,generation=0;

function mensagem(t,erro=false){el('status').textContent=t;el('status').className=erro?'erro':'';}

async function call(acao,p={}){

 const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Entre no portal de gestão para consultar os fechamentos.');

 const r=await fetch(SB+'/functions/v1/gestao-cozinha',{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...p})});

 const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível consultar.');return d;

}

async function executar(f){if(busy)return;busy=true;el('atualizar').disabled=true;const g=generation;try{await f(g);}catch(e){if(g===generation)mensagem(e.message,true);}finally{busy=false;el('atualizar').disabled=false;}}

async function carregar(g){

 mensagem('Consultando registros da cozinha…');el('relatorio').replaceChildren();const d=await call('historico');if(g!==generation)return;

 el('historico').innerHTML='<h2>Últimos '+d.limite+' fechamentos</h2>'+(d.fechamentos.length?'<div class="scroll"><table><thead><tr><th>Dia</th><th>Situação</th><th>Responsável</th><th>Baixas</th><th>Fotos</th><th></th></tr></thead><tbody>'+d.fechamentos.map(x=>'<tr><td>'+esc(dia(x.dia))+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.closed_by_name||'Em andamento')+'</td><td>'+esc(x.baixas)+'</td><td>'+esc(x.fotos)+'</td><td><button data-id="'+esc(x.closure_id)+'">Ver relatório e fotos</button></td></tr>').join('')+'</tbody></table></div>':'<p class="sub">Nenhum fechamento registrado nesta unidade.</p>');

 for(const b of el('historico').querySelectorAll('[data-id]'))b.onclick=()=>executar(g=>abrir(b.dataset.id,g));

 const pr=await call('producoes');if(g!==generation)return;

 const itens=pr.producoes??[];

 const configuracoes=await call('producao_configuracoes');if(g!==generation)return;desenharPiloto(configuracoes);

 el('producoes').innerHTML='<h2>Produção registrada no Portal · últimos '+pr.limite+'</h2><p class="sub">Ao registrar, o Portal tenta atualizar os insumos e intermediários na Takeat. A atualização usa contagens com controle de versão; falhas parciais aparecem aqui para conferência.</p>'+(itens.length?'<div class="scroll"><table><thead><tr><th>Quando</th><th>Intermediário</th><th>Produzido</th><th>Rendimento esperado</th><th>Lotes</th><th>Responsável</th><th>Takeat</th><th>Consumo da ficha</th></tr></thead><tbody>'+itens.map(x=>{const consumo=x.ficha_snapshot?.consumo_previsto??[];const etapa=x.etapas_takeat??[];const detalhe='Insumos: '+(etapa[0]||'aguardando')+' · Intermediários: '+(etapa[1]||'aguardando');const estado={somente_conferencia:'Conferência no Portal',anulada:'Anulada com histórico preservado',piloto_pausado:'Piloto pausado',atualizado:'Saldos atualizados',espelho_pendente:'Takeat atualizado · sincronize o Portal',aguardando_permissoes:'Aguardando permissões',resposta_incerta:'Resposta pendente de confirmação',parcial:'Atualização parcial · revisar',revisao_necessaria:'Revisão necessária',aguardando:'Aguardando processamento'}[x.estado_takeat]||'Revisão necessária';return '<tr><td>'+esc(dh(x.criado_em))+'</td><td>'+esc(x.intermediary_name)+'</td><td>'+esc(x.quantidade_produzida)+' '+esc(x.unidade)+'</td><td>'+esc(x.rendimento_previsto)+' '+esc(x.unidade)+'</td><td>'+esc(x.lotes)+'</td><td>'+esc(x.employee_name)+'</td><td>'+esc(estado)+'<br><small>'+esc(detalhe)+'</small>'+(x.motivo_revisao?'<br><small>'+esc(x.motivo_revisao)+'</small>':'')+(x.motivo_anulacao?'<br><small>Correção: '+esc(x.motivo_anulacao)+'</small>':'')+(x.pode_anular?'<br><button data-anular="'+esc(x.id)+'">Anular registro de conferência</button>':'')+(x.pode_processar?'<br><button data-producao="'+esc(x.id)+'">Processar / conferir</button>':'')+(x.pode_recalcular_conflito?'<br><a target="_blank" rel="noopener noreferrer" href="estoque.html?restaurant_id='+encodeURIComponent(unit)+'">Atualizar saldo no estoque</a><br><button data-recalcular="'+esc(x.id)+'">Recalcular após sincronizar</button>':'')+'</td><td><details><summary>Ver ingredientes</summary><ul>'+consumo.map(i=>'<li>'+esc(i.nome)+': '+esc(i.quantidade_prevista)+' '+esc(i.unidade)+' ('+esc(i.tipo==='intermediary'?'intermediário':'insumo')+')</li>').join('')+'</ul><p>'+esc(x.observacao||'Sem observação.')+'</p></details></td></tr>';}).join('')+'</tbody></table></div>':'<p class="sub">Nenhuma produção registrada.</p>');

 for(const b of el('producoes').querySelectorAll('[data-anular]'))b.onclick=()=>executar(async g=>{const motivo=prompt('Por que este registro de conferência deve ser anulado? O original será preservado.');if(!motivo)return;await call('anular_producao',{producao_id:b.dataset.anular,motivo});await carregar(g);mensagem('Registro anulado com motivo. Se necessário, a equipe pode registrar a produção correta.');});

 for(const b of el('producoes').querySelectorAll('[data-producao]'))b.onclick=()=>executar(g=>processarProducao(b.dataset.producao,g));

for(const b of el('producoes').querySelectorAll('[data-recalcular]'))b.onclick=()=>executar(g=>processarProducao(b.dataset.recalcular,g,true));

 mensagem('Consulta concluída.');

}



function desenharPiloto(d){

 const receitas=d.receitas??[];

 el('piloto').innerHTML='<h2>Conferência e piloto de produção</h2><p class="sub">A Takeat continua sendo a referência do saldo. Liberar um preparo afeta apenas novas produções. Registros de conferência anteriores não são enviados retroativamente.</p>'+(d.dono?'<label>Preparo<select id="piloto-receita"><option value="">Selecione</option>'+receitas.map(r=>'<option value="'+esc(r.takeat_id)+'">'+esc(r.nome)+'</option>').join('')+'</select></label><p id="piloto-atual"></p><label>Modo para as próximas produções<select id="piloto-modo"><option value="conferencia">Somente conferência no Portal</option><option value="automatico">Atualizar estoque na Takeat</option></select></label><p><label><input type="checkbox" id="piloto-conferida"> Conferi a ficha, as unidades e quem faz a baixa das vendas; a mesma produção não será lançada novamente na Takeat.</label></p><label>Motivo da alteração<textarea id="piloto-motivo" maxlength="500"></textarea></label><button id="piloto-salvar">Salvar modo do preparo</button><p class="sub">Na Takeat AI Builders, habilite inputs:stock:write e intermediaries:stock:write antes de liberar o piloto.</p><button id="piloto-renovar">Conferir permissões da conexão Takeat</button><p class="sub">Automação exige as permissões de estoque na Takeat. <a href="estoque.html?restaurant_id='+encodeURIComponent(unit)+'">Conferir conexão e saldo</a></p>':'<p class="sub">Somente o dono pode liberar ou pausar a atualização automática de cada preparo.</p>');

 if(!d.dono)return;
 el('piloto-renovar').onclick=()=>executar(async()=>{
  const {data}=await sb.auth.getSession();if(!data.session)throw Error('Entre novamente na gestão.');
  const r=await fetch(SB+'/functions/v1/takeat-reativar-escopos',{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({acao:'trocar_token_api_key'})});
  const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível conferir a conexão.');
  const faltantes=['inputs:stock:write','intermediaries:stock:write'].filter(x=>!(d.escopos_concedidos??[]).includes(x));
  mensagem(faltantes.length?'Conexão renovada. Ainda faltam permissões na Takeat: '+faltantes.join(', '):'Permissões confirmadas. Confira a ficha antes de liberar um preparo.');
 });

 const selecionar=()=>{const r=receitas.find(x=>String(x.takeat_id)===el('piloto-receita').value);el('piloto-atual').textContent=r?'Modo atual: '+(r.regra?.modo==='automatico'&&r.regra.ficha_hash===r.ficha_hash?'Automático':'Conferência')+(r.regra?' · '+r.regra.motivo:''):'';el('piloto-conferida').checked=false;};

 el('piloto-receita').onchange=selecionar;

 el('piloto-salvar').onclick=()=>executar(async g=>{

  const r=receitas.find(x=>String(x.takeat_id)===el('piloto-receita').value);if(!r)throw Error('Escolha um preparo.');

  const modo=el('piloto-modo').value,motivo=el('piloto-motivo').value.trim();if(motivo.length<5)throw Error('Explique o motivo com pelo menos cinco caracteres.');

  if(modo==='automatico'&&!el('piloto-conferida').checked)throw Error('Confirme a conferência da ficha, das unidades e da baixa de vendas.');

  if(modo==='automatico'&&!confirm('Ativar a atualização real do estoque Takeat para as próximas produções de '+r.nome+'?'))return;

  await call('configurar_producao',{takeat_id:r.takeat_id,ficha_hash:r.ficha_hash,modo,motivo,anterior_id:r.regra?.id??null,ficha_conferida:el('piloto-conferida').checked});await carregar(g);mensagem('Modo salvo. A alteração vale para novos registros.');

 });

}



async function abrir(id,g){

 mensagem('Abrindo relatório…');el('relatorio').replaceChildren();const d=await call('relatorio',{closure_id:id});if(g!==generation)return;current=id;

 const r=d.resumo;el('relatorio').innerHTML='<div class="panel"><h2>'+esc(dia(r.dia))+' · '+esc(r.status)+'</h2><p>'+esc(r.closed_by_name||r.opened_by_name)+' · '+esc(dh(r.closed_at))+'</p><p><strong>'+esc(r.baixas)+' etiquetas</strong> · '+esc(Number(r.vencidos||0)+Number(r.quebras||0))+' perdas · '+esc(r.sobras)+' sobras · '+esc(r.consumidos)+' consumidas · '+esc(r.revalidados)+' revalidadas</p><p class="sub">As quantidades abaixo descrevem o fechamento. Não são novas movimentações do estoque da Takeat.</p><h3>Observação</h3><p class="nota">'+esc(r.nota||'Sem observação.')+'</p><div class="scroll"><table><thead><tr><th>Destino</th><th>Produto</th><th>Etiquetas</th><th>Quantidade</th></tr></thead><tbody>'+d.linhas.map(x=>'<tr><td>'+esc(destino[x.outcome]||x.outcome)+'</td><td>'+esc(x.product_name)+'<br><small>'+esc(x.storage_method)+'</small></td><td>'+esc(x.etiquetas)+'</td><td>'+esc(x.quantidade??'Não informada')+' '+esc(x.unidade)+'</td></tr>').join('')+'</tbody></table></div><h3>Fotos do fechamento</h3><p class="sub">Acesso privado. Os links expiram em cinco minutos; atualize o relatório para reabrir.</p><button id="reabrir">Atualizar relatório e fotos</button><div class="galeria">'+d.fotos.map(f=>'<figure><a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+esc(f.url)+'" alt="'+esc(f.tipo==='lixeira'?'Foto da lixeira':'Foto do fechamento')+'"></a><figcaption>'+esc(f.legenda||f.tipo)+' · '+esc(f.employee_name)+'<br>'+esc(dh(f.created_at))+'</figcaption></figure>').join('')+'</div></div>';

 el('reabrir').onclick=()=>executar(g=>abrir(current,g));mensagem('Relatório aberto. Fotos disponíveis somente após conferir seu acesso.');

}

async function processarProducao(id,g,recalcular=false){

 if(recalcular&&!confirm('Antes, sincronize o saldo atual na tela Estoque. Confirmar vai criar um novo comando idempotente com a versão recém-consultada e tentar novamente as etapas que tiveram conflito.'))return;

 mensagem('Conferindo a produção com a Takeat…');

 const r=await call('processar_producao',{producao_id:id,recalcular_conflito:recalcular});if(g!==generation)return;

 const estado=r.resultado?.estado||'aguardando';

 mensagem(estado==='atualizado'?'Saldos atualizados na Takeat.':estado==='aguardando_permissoes'?'A integração aguarda os escopos de escrita da Takeat.':estado==='resposta_incerta'?'Resposta não confirmada; a mesma solicitação idempotente poderá ser consultada novamente.':'Há uma etapa que precisa de conferência da gestão.',estado==='revisao_necessaria'||estado==='parcial');

 await carregar(g);

}

sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){generation++;el('piloto').replaceChildren();el('historico').replaceChildren();el('producoes').replaceChildren();el('relatorio').replaceChildren();mensagem('Sessão encerrada. Entre novamente na gestão.',true);}});

el('atualizar').onclick=()=>executar(carregar);if(unit)executar(carregar);else mensagem('Abra este módulo pelo portal de gestão.',true);

</script></body></html>
