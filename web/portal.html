<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Colaborador — Feitoria</title>
<style>
  :root{--verde:#1f4d3a;--ambar:#c8871f;--fundo:#f4f2ed;--carta:#fff;--texto:#23261f;
        --suave:#6b7169;--erro:#a3341f;--ok:#1f6b3f;--borda:#e2ded4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);
       color:var(--texto);padding:16px;min-height:100dvh}
  .app{max-width:480px;margin:0 auto}
  .carta{background:var(--carta);border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:15px;margin:0 0 10px}
  .sub{color:var(--suave);font-size:14px;margin:0 0 16px}
  label{display:block;font-size:13px;color:var(--suave);margin:12px 0 4px}
  input{width:100%;padding:13px;border:1px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
  input.pin{font-size:26px;text-align:center;letter-spacing:10px}
  button{font:inherit;cursor:pointer;border:none;border-radius:11px;padding:15px;
         background:var(--verde);color:#fff;font-weight:600;width:100%}
  button.secundaria{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
  button.discreto{background:none;color:var(--suave);font-weight:500;padding:12px}
  button[disabled]{opacity:.5;cursor:default}
  .doc{border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:10px}
  .doc.pendente{border-color:var(--ambar);background:#fffdf8}
  .doc h3{font-size:15px;margin:0 0 3px}
  .doc .meta{color:var(--suave);font-size:13px}
  .selo{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;margin-bottom:6px}
  .selo.pendente{background:#fdf3e6;color:var(--ambar)}
  .selo.assinado{background:#e6efe9;color:var(--ok)}
  .selo.mural{background:#eceae4;color:var(--suave)}
  .aviso{background:#fdf3f1;color:var(--erro);border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
  .faixa{background:#fffdf8;border:1px solid var(--ambar);color:var(--ambar);border-radius:10px;
         padding:12px;font-size:14px;font-weight:600;margin-bottom:14px}
  .aceite{background:#f7f5f0;border-radius:10px;padding:13px;font-size:13px;line-height:1.5;
          color:var(--texto);margin:12px 0}
  .vazio{color:var(--suave);font-size:14px}
  .comprovante{font-family:ui-monospace,monospace;background:#eceae4;border-radius:8px;
               padding:7px 12px;display:inline-block;letter-spacing:2px;margin-top:8px}
  iframe{width:100%;height:58vh;border:1px solid var(--borda);border-radius:12px;background:#fff}

  :focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
  .marca{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--verde);font-weight:700;margin:0 0 10px}
  .saudacao{border-top:4px solid var(--verde)}
  .menu-portal{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--fundo);padding:8px 0 12px;z-index:2;margin-bottom:12px}
  .menu-portal button{flex:0 0 auto;width:auto;padding:12px 14px;white-space:nowrap;font-size:13px}
  .atalhos-portal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .atalhos-portal button{display:flex;flex-direction:column;gap:6px;text-align:left;background:white;color:var(--verde);border:1px solid var(--borda);padding:16px;min-height:100px}
  .atalhos-portal small{color:var(--suave);font-weight:400;line-height:1.4;font-size:12px}
  .atalhos-portal .principal{background:var(--verde);color:white;border-color:var(--verde)}
  .atalhos-portal .principal small{color:#e0ece5}
  .assinatura-inicio{background:#fff8e8;border:1px solid #ddc283;border-radius:12px;padding:14px;margin-bottom:16px}
  .assinatura-inicio p{font-size:14px;line-height:1.5;margin:0 0 10px}
  .assinatura-inicio button{padding:10px}
  .cabecalho-docs{display:flex;gap:12px;align-items:center;justify-content:space-between}
  .cabecalho-docs button{width:auto;padding:8px;font-size:13px}
  .doc .meta{line-height:1.6;overflow-wrap:anywhere}
  .vazio{padding:16px;background:#f7f8f5;border-radius:10px;line-height:1.5}
  .frame-atividade{padding:10px}
  @media(max-width:360px){body{padding:10px}.carta{padding:16px}.atalhos-portal{gap:8px}.atalhos-portal button{padding:13px}}

</style>
<link rel="stylesheet" href="assets/employee.css"></head>
<body><header class="employee-header"><svg class="employee-brand" viewBox="0 0 48 48" aria-hidden="true"><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(0 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(30 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(60 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(90 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(120 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(150 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(180 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(210 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(240 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(270 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(300 24 24)"/><rect x="22" y="3" width="4" height="14" rx="2" fill="currentColor" transform="rotate(330 24 24)"/></svg><div><strong>Feitoria da Cerveja</strong><small>Seu espaço · sua rotina</small></div><button id="employee-theme" class="employee-theme" type="button" aria-label="Ativar tema escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg></button></header>
<div class="app" id="app"></div>

<script>
// Portal do colaborador. Fala só com a Edge Function `portal`.
// Identidade: PIN + data de nascimento + aparelho vinculado.
const FUNCAO = "https://kujelbcbrcmkitzyswbh.supabase.co/functions/v1/portal";
const TOKEN_UNIDADE = new URLSearchParams(location.search).get("u") || "";

const app = document.getElementById("app");
/* A07 da revisão: dado do servidor entra como texto, nunca como marcação. */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));

let pin = "", nascimento = "", sessao = null;
let secao = "inicio", tempoSessao = null, frameAtivo = null;
// Cozinha incorporada: somente esta janela e a sessão ativa recebem respostas.
window.addEventListener("message",async e=>{
  if(e.origin!==location.origin || e.source!==frameAtivo?.contentWindow || !sessao || secao!=="cozinha" || sessao.perfil!=="completo")return;
  if(e.data?.tipo==="feitoria-cozinha-altura"){const h=Number(e.data.altura);if(Number.isFinite(h))frameAtivo.style.height=Math.min(6000,Math.max(500,h))+"px";if(e.data.inicio)frameAtivo.scrollIntoView({block:"start"});return;}
  if(e.data?.tipo!=="feitoria-cozinha-chamar" || typeof e.data.id!=="string")return;
  const janela=frameAtivo.contentWindow, atual=sessao, id=e.data.id;
  manterSessao();
  try{
    const d=await chamar({action:"cozinha",operacao:e.data.operacao,dados:e.data.dados,requisicao:id,motivo:e.data.motivo});
    if(sessao===atual && janela===frameAtivo?.contentWindow)janela.postMessage({tipo:"feitoria-cozinha-resposta",id,dados:d},location.origin);
  }catch(err){if(sessao===atual && janela===frameAtivo?.contentWindow)janela.postMessage({tipo:"feitoria-cozinha-resposta",id,erro:err.message},location.origin);}
});

function encerrarPortal(){ frameAtivo=null; clearTimeout(tempoSessao); sessao=null; pin=""; nascimento=""; secao="inicio"; telaEntrar(); }
function manterSessao(){
  clearTimeout(tempoSessao);
  if(sessao) tempoSessao=setTimeout(encerrarPortal, 5*60*1000);
}
window.addEventListener("message",e=>{
  if(e.origin===location.origin && e.source===frameAtivo?.contentWindow && e.data?.tipo==="feitoria-atividade")manterSessao();
});
["click","keydown","touchstart"].forEach(tipo=>document.addEventListener(tipo,manterSessao,{passive:true}));

// Identificador do aparelho: gerado aqui, guardado aqui. Não é dado do celular,
// é um número aleatório — serve só para reconhecer que é o mesmo aparelho.
function aparelho(){
  let id = null;
  try { id = localStorage.getItem("feitoria_aparelho"); } catch {}
  if(!id){
    id = (crypto.randomUUID?.() || String(Date.now()) + Math.random()).replace(/-/g,"");
    try { localStorage.setItem("feitoria_aparelho", id); } catch {}
  }
  return id;
}

// A03 da revisão: "2026-09-30" é uma DATA, não um instante. Passar isso por
// new Date() cria meia-noite em UTC, que em São Paulo ainda é dia 29 — o prazo
// aparecia um dia antes. Campos do tipo date no banco (documents.prazo,
// documents.data_documento) caem aqui; timestamptz continua convertendo normal.
const SO_DATA = /^\d{4}-\d{2}-\d{2}$/;
const dataBR = (valor) => {
  if(!valor) return "";
  if(SO_DATA.test(valor)) return valor.split("-").reverse().join("/");
  return new Date(valor).toLocaleDateString("pt-BR", { timeZone:"America/Sao_Paulo" });
};
const dataHoraBR = (iso) => iso ? new Date(iso).toLocaleString("pt-BR",
  {dateStyle:"short", timeStyle:"short", timeZone:"America/Sao_Paulo"}) : "";

async function chamar(payload){
  const r = await fetch(FUNCAO, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ unit_token: TOKEN_UNIDADE, pin, nascimento,
      device_hash: aparelho(), device_label: navigator.platform || "Celular", ...payload })
  });
  const d = await r.json().catch(()=>({error:"Resposta inválida."}));
  if(!r.ok) throw new Error(d.error || "Não foi possível completar.");
  return d;
}

/* ---------- entrar ---------- */
function telaEntrar(msg){
  app.innerHTML = `
    <div class="carta">
      <h1>Portal do Colaborador</h1>
      <p class="sub">Feitoria da Cerveja</p>
      ${msg ? `<div class="aviso">${esc(msg)}</div>` : ""}
      <p class="marca">Feitoria · Minha rotina</p><label for="pin">Seu PIN</label>
      <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="off"
             maxlength="6" placeholder="••••">
      <label for="nasc">Sua data de nascimento</label>
      <input type="date" id="nasc">
      <button id="entrar" style="margin-top:18px">Entrar</button>
      <p class="sub" style="margin:14px 0 0;font-size:12px">
        Seu PIN é pessoal. Não empreste: o que for feito com ele fica no seu nome.</p>
    </div>`;
  document.getElementById("entrar").onclick = entrar;
  document.getElementById("nasc").onkeydown = (e) => { if(e.key === "Enter") { e.preventDefault(); entrar(); } };
}

async function entrar(){
  const bt = document.getElementById("entrar");
  pin = document.getElementById("pin").value.trim();
  nascimento = document.getElementById("nasc").value;
  if(pin.length < 4 || !nascimento) return telaEntrar("Preencha o PIN e a data de nascimento.");
  bt.disabled = true; bt.textContent = "Entrando…";
  try { sessao = await chamar({ action:"entrar" }); telaInicio(); }
  catch(e){ pin = ""; telaEntrar(e.message); }
}

/* ---------- início ---------- */
function telaInicio(msg){
  manterSessao();
  frameAtivo=null;
  const tipos = new Set(sessao.tipos_treinamento || []);
  const docs = sessao.documentos.filter(d => secao === "treinamentos" ? tipos.has(d.tipo) : secao === "documentos" ? !tipos.has(d.tipo) : true).slice().sort((a,b)=>Number(!!b.pendente)-Number(!!a.pendente));
  const pendentes=docs.filter(d=>d.pendente).length;
  const menu = [["inicio","Início"],["documentos","Documentos"],["treinamentos","Treinamentos"],
    ["checklists","Checklists"],["operacao","Escala e avisos"],["seguranca","Saúde e segurança"]];
  if(sessao.perfil==="completo")menu.push(["cozinha","Fechamento da cozinha"]);
  if(sessao.registra_ponto) menu.splice(3,0,["ponto","Ponto"]);
  app.innerHTML = `
    <div class="carta saudacao">
      <p class="marca">Feitoria · Minha rotina</p><h1>Olá, ${esc(sessao.colaborador.nome.split(" ")[0])}</h1>
      <p class="sub" style="margin:0">${esc(sessao.colaborador.funcao || "")} · ${esc(sessao.unidade.nome)}</p>
    </div>
    <nav class="menu-portal" aria-label="Meu portal">${menu.map(([id,nome])=>
      `<button class="${secao===id?"":"secundaria"}" style="width:auto;padding:11px" data-secao="${id}" aria-current="${secao===id?"page":"false"}">${nome}</button>`).join("")}</nav>
    ${msg ? `<div class="carta"><div class="aviso">${esc(msg)}</div></div>` : ""}
    <div class="carta" id="conteudo-portal">
      <div class="cabecalho-docs"><h2>${secao==="treinamentos"?"Treinamentos e certificados":secao==="inicio"?"Para você conferir":"Meus documentos"}</h2>${secao==="inicio"?'<button class="discreto" data-secao="documentos">Ver documentos →</button>':""}</div>
      ${pendentes && secao!=="inicio" ? `<div class="faixa">
        ${pendentes} documento${pendentes>1?"s":""} esperando sua assinatura</div>` : ""}
      ${docs.length ? (secao==="inicio"?docs.slice(0,3):docs).map(d => `
        <div class="doc ${d.pendente?"pendente":""}">
          ${d.pendente ? `<span class="selo pendente">assinar</span>`
            : d.assinado_em ? `<span class="selo assinado">assinado em ${dataBR(d.assinado_em)}</span>`
            : d.mural ? `<span class="selo mural">mural</span>` : ""}
          <h3>${esc(d.titulo)}</h3>
          <p class="meta">${esc(d.competencia ? "Competência "+d.competencia+" · " : "")}recebido em ${dataBR(d.recebido_em)}
            ${d.prazo ? " · prazo "+dataBR(d.prazo) : ""}</p>
          <button class="secundaria" style="margin-top:10px" data-abrir="${esc(d.id)}">${d.pendente?"Ler e revisar para assinar":"Ver documento"}</button>
        </div>`).join("") : `<p class="vazio">Nenhum documento por aqui ainda.</p>`}
    </div>
    <button class="discreto" id="sair">Sair</button>`;

  app.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => abrir(b.dataset.abrir));
  document.getElementById("sair").onclick = encerrarPortal;
  app.querySelectorAll("[data-secao]").forEach(b=>b.onclick=()=>{secao=b.dataset.secao; telaInicio();});
  if(secao === "inicio"){
    const card=document.createElement("section");card.setAttribute("aria-label","Atalhos da sua rotina");card.className="atalhos-portal";
    const atalhos=[...(sessao.registra_ponto?[["ponto","Meu ponto","Registrar ou consultar marcações."]]:[]),
      ["checklists","Checklists","Começar ou continuar as tarefas."],["operacao","Escala e avisos","Conferir seu turno e os recados."],
      ["documentos","Documentos","Consultar e revisar assinaturas."],["treinamentos","Treinamentos","Materiais e certificados."],
      ["seguranca","Saúde e segurança","Orientações para trabalhar bem."]];
    if(sessao.perfil==="completo")atalhos.push(["cozinha","Fechamento da cozinha","Etiquetas, perdas, sobras e fotos do turno."]);
    card.innerHTML=atalhos.map(([id,titulo,descricao],i)=>`<button data-secao="${id}" class="${i===0?'principal':''}"><strong>${titulo}</strong><small>${descricao}</small></button>`).join("");
    card.querySelectorAll("[data-secao]").forEach(b=>b.onclick=()=>{secao=b.dataset.secao;telaInicio();});
    app.insertBefore(card,document.getElementById("conteudo-portal"));
    if(pendentes){
      const aviso=document.createElement("section");aviso.className="assinatura-inicio";
      aviso.innerHTML=`<p><strong>${pendentes} documento${pendentes>1?"s":""} esperando sua assinatura</strong><br>Leia e confira antes de confirmar.</p><button class="secundaria">Conferir pendências</button>`;
      aviso.querySelector("button").onclick=()=>document.getElementById("conteudo-portal").scrollIntoView({block:"start"});
      app.insertBefore(aviso,card);
    }
  }
  const paginas={checklists:"checklist.html",operacao:"operacao.html",seguranca:"nr1.html"};
  if(secao==="ponto" && sessao.registra_ponto) paginas.ponto="ponto.html";
  if(sessao.perfil==="completo")paginas.cozinha="cozinha-fechamento.html";
  if(paginas[secao]){
    const card=document.getElementById("conteudo-portal");
    card.classList.add("frame-atividade");
    card.replaceChildren();
    if(secao==="ponto"){
      const aviso=document.createElement("p");aviso.className="sub";
      aviso.textContent="Ponto no celular abaixo. Para usar o totem, vá ao aparelho fixo da unidade e digite seu PIN. Não é necessário marcar nos dois aparelhos.";
      card.append(aviso);
    }
    const frame=document.createElement("iframe");
    const url=new URL(paginas[secao],location.href);url.searchParams.set("u",TOKEN_UNIDADE);
    frame.src=url.href;frame.title=menu.find(([id])=>id===secao)?.[1] || "Atividade";
    frame.style="width:100%;height:75dvh;min-height:500px;border:0";
    if(secao==="ponto") frame.allow="camera 'self'; geolocation 'self'";
    if(["checklists","cozinha"].includes(secao)) frame.allow="camera 'self'";
    frame.onload=()=>{
      if(sessao && ["ponto","checklists"].includes(secao))frame.contentWindow.postMessage({tipo:"feitoria-identificar",unidade:TOKEN_UNIDADE,pin},location.origin);
    };
    frameAtivo=frame;card.append(frame);
  }
}

/* ---------- abrir e assinar ---------- */
async function abrir(id){
  app.innerHTML = `<div class="carta"><p class="vazio">Abrindo…</p></div>`;
  try {
    const d = await chamar({ action:"abrir", id });
    app.innerHTML = `
      <div class="carta">
        <h1>${esc(d.titulo)}</h1>
        ${d.ja_assinei
          ? `<p class="sub">Assinado em ${dataHoraBR(d.assinado_em)}
               <br><span class="comprovante">${esc(d.comprovante)}</span></p>`
          : d.exige_assinatura ? `<p class="sub">Leia até o fim antes de assinar.</p>` : ""}
        <iframe src="${esc(d.url)}" title="Documento"></iframe>
        <p class="sub" style="margin:8px 0 0;font-size:12px">
          Não abriu? <a href="${esc(d.url)}" target="_blank" rel="noopener">toque aqui</a>.
          O link vale por 5 minutos.</p>
        ${(d.exige_assinatura && !d.ja_assinei) ? `
          <div class="aceite">${esc(d.texto_aceite)}</div>
          <label>Digite seu PIN para assinar</label>
          <input class="pin" id="pin-assinar" type="password" inputmode="numeric"
                 autocomplete="off" maxlength="6" placeholder="••••">
          <div id="erro-assinar"></div>
          <button id="assinar" style="margin-top:12px">Assinar documento</button>` : ""}
        <button class="discreto" id="voltar" style="margin-top:10px">Voltar</button>
      </div>`;
    document.getElementById("voltar").onclick = voltar;
    const bt = document.getElementById("assinar");
    if(bt) bt.onclick = () => assinar(id, bt);
  } catch(e){ telaInicio(e.message); }
}

async function assinar(id, bt){
  const digitado = document.getElementById("pin-assinar").value.trim();
  const erro = document.getElementById("erro-assinar");
  // O PIN é o ato da assinatura: precisa ser digitado de novo, não herdado da sessão.
  if(digitado !== pin){
    erro.innerHTML = `<div class="aviso">PIN incorreto.</div>`;
    return;
  }
  bt.disabled = true; bt.textContent = "Assinando…";
  try {
    const r = await chamar({ action:"assinar", id });
    app.innerHTML = `
      <div class="carta" style="text-align:center">
        <div style="font-size:52px;color:var(--ok);line-height:1">✓</div>
        <h1 style="margin:10px 0 4px">Documento assinado</h1>
        <p class="sub">${esc(r.titulo)}<br>${dataHoraBR(r.assinado_em)}</p>
        <span class="comprovante">${esc(r.comprovante)}</span>
        <button style="margin-top:20px" id="ok">Pronto</button>
      </div>`;
    document.getElementById("ok").onclick = voltar;
  } catch(e){
    bt.disabled = false; bt.textContent = "Assinar documento";
    erro.innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
  }
}

async function voltar(){
  try { sessao = await chamar({ action:"documentos" }); telaInicio(); }
  catch(e){ sessao=null; pin=""; telaEntrar(e.message); }
}

telaEntrar();
</script>
<footer class="employee-footer">Feitoria · Portal do colaborador<br><a href="privacidade.html">Privacidade e proteção dos seus dados</a></footer><script src="assets/employee-theme.js"></script></body>
