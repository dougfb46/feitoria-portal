<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados e metas · Feitoria</title><style>
:root{--ink:#233b30;--green:#245a43;--muted:#657165;--line:#dfe4da}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 12px}.sub,small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:13px}input,select,button{font:inherit;border:1px solid #b8c8ba;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.6;cursor:wait}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card strong{display:block;font-size:26px;margin:8px 0;color:var(--green)}.warning{background:#fff4df;border-left:4px solid #c58d38;padding:12px 16px;margin:16px 0}.error{color:#922f24}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--green)}.num{text-align:right;white-space:nowrap}#heat td{text-align:center;min-width:61px;padding:8px 4px;border:3px solid white;border-radius:6px;font-size:11px}#heat th:first-child{position:sticky;left:0;background:white;min-width:100px}summary{cursor:pointer;font-weight:600;color:var(--green)}#progress{white-space:pre-line}a{color:var(--green)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}main{padding:10px}.panel{padding:14px}.card strong{font-size:22px}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
 .abas{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.abas button.ativa{background:#245a43;color:white}.view[hidden]{display:none}.grafico{width:100%;height:auto;max-height:320px}.bar{height:11px;background:#e8eee3;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:#2d7355}.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}input,select,textarea{max-width:100%;width:100%}input[type=checkbox]{width:auto}textarea{font:inherit;min-height:70px}.muted{color:#657165}.tag{padding:2px 6px;border-radius:5px;background:#edf2e8}.A{color:#245a43}.B{color:#9b6a19}.C{color:#777}.pendente{background:#fff3de;padding:10px;border-radius:8px}.view h3{margin-top:24px}.cadastro{scroll-margin-top:15px}@media(max-width:800px){.duas,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>Resultados e metas</h1><p id="intro" class="sub">Conferindo acesso do dono…</p><section class="panel"><div class="filters"><label>Início<input id="inicio" type="date"></label><label>Fim<input id="fim" type="date"></label><button id="consultar" class="primary" disabled>Atualizar análise</button></div><p id="progress" role="status" aria-live="polite"></p></section><div id="result"></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ',sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id');
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>x===null||x===undefined?'Pendente':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(x/100),num=x=>x===null||x===undefined?'Pendente':new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3}).format(x),pct=x=>x===null||x===undefined?'Pendente':num(x)+'%',date=x=>x?x.slice(8,10)+'/'+x.slice(5,7)+'/'+x.slice(0,4):'—';
const nomes={compras_estoque:'Compras para estoque',tributos_vendas:'Tributos sobre vendas (conciliação)',deducoes_receita:'Descontos e devoluções (conciliação)',variaveis:'Outras despesas variáveis',pessoal:'Pessoal',fixas:'Despesas fixas',depreciacao:'Depreciação',financeiras:'Despesas financeiras',tributos_lucro:'Tributos sobre lucro',investimentos:'Investimentos',retiradas:'Retiradas',receita_vendas:'Receita de vendas (conciliação)',outras_receitas:'Outras receitas',receita:'Receita bruta de itens',almoco:'Pratos de almoço',pratos:'Pratos (inclui almoço)',chopes:'Chopes',produto:'Produto',chope:'Chope',prato:'Prato',outros:'Outros'};
let latest=null,busy=false,view='resumo';
function aviso(t,e=false){el('progress').textContent=t;el('progress').className=e?'error':'';}
async function call(acao,body={}){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Entre novamente no portal de gestão.');const r=await fetch(SB+'/functions/v1/gestao-resultados',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...body})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível concluir.');return d;}
function tabela(h,rows){return '<div class="scroll"><table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function options(list,selected=''){return list.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+esc(t)+'</option>').join('');}
function grafico(rows,value,label,color='#2d7355',divisor=1){const vals=rows.map(r=>r[value]===null?null:r[value]/divisor),max=Math.max(1,...vals.filter(x=>x!==null&&Number.isFinite(x))),w=900,h=230,n=Math.max(1,rows.length),step=800/n;return '<svg class="grafico" viewBox="0 0 900 280" role="img" aria-label="'+esc(label)+'"><title>'+esc(label)+'</title>'+rows.map((r,i)=>{const v=r[value]===null?null:r[value]/divisor,height=v===null?2:Math.max(0,v/max*180),x=70+i*step;return '<rect x="'+x+'" y="'+(h-height)+'" width="'+Math.max(2,step-8)+'" height="'+height+'" fill="'+(v===null?'#b7bdb3':color)+'"><title>'+esc(r.nome??r.inicio??r.centro??'')+': '+(v===null?'Pendente':num(v))+'</title></rect><text x="'+x+'" y="250" font-size="11">'+esc(r.nome??date(r.inicio)??'')+'</text>';}).join('')+'<text x="4" y="35" font-size="12">Máx. '+num(max)+'</text></svg>';}
function pareto(rows){if(!rows.length||!rows[0].centavos)return '<p>Sem valor positivo elegível para desenhar a curva neste período.</p>';const max=rows[0].centavos,n=rows.length,step=820/n;return '<svg class="grafico" viewBox="0 0 920 290" role="img" aria-label="Curva ABC por valor de venda"><title>Todos os produtos por valor bruto; linha de participação acumulada</title><line x1="60" y1="58" x2="880" y2="58" stroke="#c4974b" stroke-dasharray="5 5"/><text x="883" y="62" font-size="11">80%</text><line x1="60" y1="28" x2="880" y2="28" stroke="#aaa" stroke-dasharray="5 5"/><text x="883" y="32" font-size="11">95%</text>'+rows.map((r,i)=>'<rect x="'+(60+i*step)+'" y="'+(250-r.centavos/max*200)+'" width="'+Math.max(.5,step-.8)+'" height="'+(r.centavos/max*200)+'" fill="'+({A:'#2d7355',B:'#c4974b',C:'#b7bdb3'})[r.classe]+'"><title>'+esc(r.nome)+' · '+money(r.centavos)+' · '+r.classe+'</title></rect>').join('')+'<polyline fill="none" stroke="#345d83" stroke-width="2.5" points="'+rows.map((r,i)=>(60+(i+.5)*step)+','+(250-r.acumulado*2.4)).join(' ')+'"/><text x="60" y="278" font-size="12">Barras: valor bruto · linha: participação acumulada · '+n+' produtos</text></svg>';}
function campo(id,label,type='text',value='',extra=''){return '<label>'+esc(label)+'<input id="'+id+'" name="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+' required></label>';}
function moeda(id,label,value=null){return campo(id,label+' (R$)','number',value===null?'':(value/100).toFixed(2),'min="0" step="0.01"');}
function motivo(id){return campo(id+'-motivo','Fonte / motivo do lançamento','text','','minlength="5" maxlength="300"');}
function salvarBtn(){return '<p><button type="submit" class="primary">Salvar nova versão</button></p>';}
function select(id,label,list,value=''){return '<label>'+esc(label)+'<select id="'+id+'">'+options(list,value)+'</select></label>';}
function tab(v){view=v;for(const s of document.querySelectorAll('.view'))s.hidden=s.id!=='view-'+v;for(const b of document.querySelectorAll('[data-view]'))b.classList.toggle('ativa',b.dataset.view===v);}
async function consultar(){if(busy)return;busy=true;el('consultar').disabled=true;try{aviso('Preparando análises e cobertura dos dados…');latest=await call('resumo',{inicio:el('inicio').value,fim:el('fim').value});render(latest);aviso('Análise do período '+date(latest.inicio)+' a '+date(latest.fim)+'. Dados das coletas concluídas; não são vendas em tempo real.');}catch(e){latest=null;el('result').replaceChildren();aviso(e.message,true);}finally{busy=false;el('consultar').disabled=false;}}
function render(d){
 const classes=['A','B','C'].map(cl=>({nome:cl,valor:d.abc.filter(p=>p.classe===cl).reduce((a,p)=>a+p.centavos,0),n:d.abc.filter(p=>p.classe===cl).length}));
 const optsProdutos=d.vendas.produtos.filter(p=>/^\d+$/.test(p.id)).map(p=>[p.id,p.nome]),cats=[...d.custos.sem_regra,...d.custos.classificados].map(c=>[c.categoria,c.categoria]);
 const semanas=d.cmo.map(w=>[w.inicio,date(w.inicio)+' a '+date(w.fim)]),grupoOpt=Object.entries(nomes).filter(([k])=>['compras_estoque','tributos_vendas','deducoes_receita','variaveis','pessoal','fixas','depreciacao','financeiras','tributos_lucro','investimentos','retiradas','receita_vendas','outras_receitas'].includes(k));
 const pend=[...d.dre.pendencias];if(d.sem_familia)pend.push(d.sem_familia+' produtos sem família aprovada para metas de almoço/pratos/chopes.');const faltamCmo=d.cmo.filter(w=>!w.base).length;if(faltamCmo)pend.push(faltamCmo+' semanas sem base de CMO.');if(!d.metas.length)pend.push('Não há meta ativa no período exibido.');if(!d.cmv.inventarios_encerrados)pend.push('Nenhum inventário encerrado no portal. Bases externas podem ser informadas com fonte.');
 el('result').innerHTML=`<div class="cards"><div class="card"><small>Receita bruta de itens</small><strong>${money(d.cobertura?d.vendas.receita:null)}</strong><small>Todas as vendas da unidade</small></div><div class="card"><small>CMV do período</small><strong>${money(d.cmv.valor)}</strong><small>${d.cmv.base?esc(d.cmv.base.situacao):'Inventário e entradas pendentes'} · ${pct(d.cmv.percentual)} da receita líquida</small></div><div class="card"><small>Resultado gerencial</small><strong>${money(d.dre.resultado)}</strong><small>${d.dre.pendencias.length} pendências de fechamento</small></div><div class="card"><small>Produtos na curva ABC</small><strong>${d.abc.length}</strong><small>Todos os produtos elegíveis</small></div></div><nav class="abas">${[['resumo','Diagnóstico'],['abc','Curva ABC'],['dre','DRE e centros'],['custos','CMV e CMO'],['metas','Metas'],['cadastros','Cadastros']].map(([v,t])=>'<button data-view="'+v+'">'+t+'</button>').join('')}</nav>
 <section id="view-resumo" class="view panel"><h2>O que precisa de atenção</h2><ul>${pend.map(p=>'<li>'+esc(p)+'</li>').join('')}</ul><h3>Despesas registradas por categoria</h3><p class="sub">Categorias informadas pela Takeat; não equivalem a CMV ou custo completo. As diferenças de conciliação permanecem sinalizadas.</p>${[...d.custos.sem_regra,...d.custos.classificados].filter(c=>c.despesas>0).sort((a,b)=>b.despesas-a.despesas).slice(0,12).map(c=>'<p>'+esc(c.categoria)+' · '+money(c.despesas)+'</p><div class="bar"><span style="width:'+Math.min(100,c.despesas/Math.max(1,...[...d.custos.sem_regra,...d.custos.classificados].map(x=>x.despesas))*100)+'%"></span></div>').join('')||'<p>Sem categorias financeiras disponíveis.</p>'}<h3>Concentração de vendas</h3>${tabela(['Classe','Produtos','Valor bruto','Participação'],classes.map(c=>[c.nome,c.n,money(c.valor),d.vendas.receita?pct(c.valor/d.vendas.receita*100):'—']))}<p>Priorize a disponibilidade dos itens A. Esta classificação mostra concentração de venda; não demonstra margem nem rentabilidade.</p><h3>Critérios da análise</h3><ul>${d.criterios.map(c=>'<li>'+esc(c)+'</li>').join('')}</ul></section>
 <section id="view-abc" class="view panel" hidden><h2>Curva ABC de produtos</h2><p class="sub">A: até cruzar 80% do valor bruto; B: até cruzar 95%; C: restante. Produtos empatados ficam na mesma classe. Quantidades de formatos diferentes não equivalem a litros ou porções iguais.</p>${pareto(d.abc)}<p><button id="abc-csv">Baixar curva ABC</button></p>${tabela(['Classe','Produto','Quantidade','Valor bruto','%','% acumulada','Família'],d.abc.map(p=>['<b class="'+p.classe+'">'+p.classe+'</b>',esc(p.nome),num(p.qtd),money(p.centavos),pct(p.participacao),pct(p.acumulado),esc(nomes[p.familia]??'Classificar')]))}</section>
 <section id="view-dre" class="view panel" hidden><h2>DRE gerencial detalhada</h2><div class="warning">${d.dre.resultado===null?'Pré-fechamento: resultado bloqueado enquanto houver pendências de cobertura e conciliação.':'Fechamento gerencial sobre as bases conferidas.'} A receita financeira não é somada às vendas. Compras de estoque entram no CMV quando consumidas; investimentos e retiradas ficam fora do resultado.</div>${tabela(['Linha','Valor','Base'],d.dre.linhas.map(l=>[esc(nomes[l.nome]??l.nome),money(l.valor),esc(l.base)]))}<h3>Movimentação classificada por centro</h3><p class="sub">Inclui compras e investimentos quando classificados; é visão de alocação, não soma adicional de despesas da DRE.</p>${d.custos.centros.map(c=>'<p>'+esc(c.centro)+' · '+money(c.despesas)+'</p><div class="bar"><span style="width:'+Math.min(100,c.despesas/Math.max(1,...d.custos.centros.map(x=>x.despesas))*100)+'%"></span></div>').join('')||'<p>Cadastre as classificações para preencher os centros.</p>'}<h3>Detalhamento por categoria</h3>${tabela(['Categoria','Grupo DRE','Centro','Comportamento','Despesas','Receitas'],d.custos.classificados.map(c=>[esc(c.categoria),esc(nomes[c.grupo]),esc(c.centro),esc(c.comportamento),money(c.despesas),money(c.receitas)]))}<h3>Categorias pendentes de classificação</h3>${tabela(['Categoria','Despesas','Receitas','Pendência'],d.custos.sem_regra.map(c=>[esc(c.categoria),money(c.despesas),money(c.receitas),esc(c.motivo)]))}<p><button data-view="cadastros">Classificar categorias e centros</button></p></section>
 <section id="view-custos" class="view panel" hidden><h2>CMV · custo da mercadoria vendida</h2><p class="sub">Estoque inicial + compras líquidas + transferências recebidas − transferências enviadas − estoque final. Bases monetárias com mesma abrangência; perdas incorporadas no inventário não são descontadas novamente.</p>${d.cmv.base?'<p>Base '+esc(d.cmv.base.situacao)+' · fonte: '+esc(d.cmv.base.fonte)+'</p>'+grafico([{nome:'EI',valor:d.cmv.base.estoque_inicial},{nome:'Compras',valor:d.cmv.base.compras_liquidas},{nome:'Transf. +',valor:d.cmv.base.transferencias_entrada},{nome:'Transf. −',valor:d.cmv.base.transferencias_saida},{nome:'EF',valor:d.cmv.base.estoque_final},{nome:'CMV',valor:d.cmv.valor}],'valor','Componentes do CMV em reais','#2d7355',100)+tabela(['Componente','Valor'],[['Estoque inicial',money(d.cmv.base.estoque_inicial)],['Compras líquidas',money(d.cmv.base.compras_liquidas)],['Transferências de entrada',money(d.cmv.base.transferencias_entrada)],['Transferências de saída',money(d.cmv.base.transferencias_saida)],['Estoque final',money(d.cmv.base.estoque_final)],['CMV',money(d.cmv.valor)]]):'<p class="pendente">Sem base de CMV para este período. Informe inventário e entradas nos cadastros.</p>'}<h2>CMO semanal · custo de mão de obra</h2><p class="sub">Salários + encargos/provisões + benefícios + freelas + extras. Semana completa de segunda a domingo; semanas que cruzam o recorte incluem os dias externos. O CMO analítico não é descontado uma segunda vez na DRE.</p><h3>Pessoal identificado nos lançamentos · parcial do recorte</h3><p class="sub">Valores classificados como pessoal ou identificados pelas categorias de salários/encargos/benefícios e mão de obra. Não incluem automaticamente folha, provisões e pagamentos ausentes. Não são o CMO completo.</p>${grafico(d.cmo,'identificado_takeat','Pessoal identificado na Takeat por semana (R$)','#91a88d',100)}<h3>CMO completo informado · percentual da receita bruta</h3>${grafico(d.cmo,'percentual','CMO semanal em % da receita bruta')}<p class="sub">Barras cinzas: percentual pendente. Valores estimados permanecem identificados.</p>${tabela(['Semana completa','Receita bruta','Pessoal identificado Takeat (parcial)','CMO informado','CMO %','Base'],d.cmo.map(w=>[date(w.inicio)+' a '+date(w.fim)+(w.parcial_no_recorte?' *':''),money(w.receita),money(w.identificado_takeat),money(w.custo),pct(w.percentual),esc(w.situacao)]))}${d.cmo.filter(w=>w.base).map(w=>'<details><summary>'+date(w.inicio)+' · componentes do CMO</summary>'+tabela(['Componente','Valor'],['salarios','encargos','beneficios','freelas','extras'].map(k=>[esc(k),money(w.base[k])]))+'<p>Fonte: '+esc(w.base.fonte)+'</p></details>').join('')}<p><button data-view="cadastros">Informar bases de CMV e CMO</button></p></section>
 <section id="view-metas" class="view panel" hidden><h2>Metas de receita e produtos</h2><p>Receita usa valor bruto de itens. Metas de almoço, pratos e chopes dependem da classificação dos produtos; quantidades são unidades de produto, não litros. Metas diárias respeitam os dias da semana escolhidos.</p>${d.metas.map(m=>'<section class="panel"><h3>'+esc(nomes[m.metrica])+(m.produto_id?' · '+esc(d.vendas.produtos.find(p=>p.id===m.produto_id)?.nome??m.produto_id):'')+'</h3><p>'+date(m.inicio)+' a '+date(m.fim)+' · '+esc(m.frequencia)+' · Realizado '+(m.metrica==='receita'?money(m.realizado):num(m.realizado))+' / Meta '+(m.metrica==='receita'?money(m.alvo_no_recorte):num(m.alvo_no_recorte))+' · '+pct(m.atingimento)+'</p><div class="bar"><span style="width:'+Math.min(100,m.atingimento??0)+'%"></span></div>'+(m.classificacao_pendente?'<p class="pendente">Classificação de famílias incompleta: realizado parcial e atingimento pendente.</p>':'')+(m.parcial?'<p class="pendente">A meta cobre um período maior: amplie o recorte para comparar.</p>':'')+(m.frequencia==='diaria'?tabela(['Dia','Realizado','Meta'],m.dias.map(x=>[date(x.data),m.metrica==='receita'?money(x.realizado):num(x.realizado),m.metrica==='receita'?money(x.alvo):num(x.alvo)])):'')+'</section>').join('')||'<p class="pendente">Nenhuma meta cadastrada para este recorte. Cadastre valores e dias para começar.</p>'}<p><button data-view="cadastros">Cadastrar ou revisar metas</button></p></section>
 <section id="view-cadastros" class="view panel" hidden><h2>Bases e planejamento</h2><p class="sub">Cada salvamento cria nova versão com autor, horário e motivo. Use valores conferidos ou marque como estimativa. Campos monetários vazios não viram zero.</p>
 <details class="cadastro"><summary>1 · Classificação de categorias e centros de custo</summary><form id="form-regra"><div class="formgrid">${select('regra-categoria','Categoria Takeat',cats)}${campo('regra-vigencia','Válida a partir de','date',d.inicio)}${select('regra-grupo','Grupo DRE',grupoOpt)}${campo('regra-centro','Centro de custo','text','','list="centros-sug" maxlength="80"')}<datalist id="centros-sug"><option value="Cozinha"><option value="Bar e choperia"><option value="Salão"><option value="Administrativo"><option value="Eventos"><option value="Geral"></datalist>${select('regra-comportamento','Comportamento',[['fixo','Fixo'],['variavel','Variável'],['nao_se_aplica','Não se aplica']])}${select('regra-ativo','Regra',[['true','Ativa'],['false','Inativa']])}${motivo('regra')}</div>${salvarBtn()}</form><p>Grupos sugerem a natureza da conta; centros indicam a área responsável. Revise cada regra antes de salvar.</p></details>
 <details class="cadastro"><summary>2 · Famílias de produtos para metas</summary><form id="form-produto"><div class="formgrid">${select('produto-id','Produto',optsProdutos)}${select('produto-familia','Família',[['almoco','Prato de almoço'],['prato','Outro prato'],['chope','Chope'],['outros','Outros']])}${select('produto-ativo','Classificação',[['true','Ativa'],['false','Inativa']])}${motivo('produto')}</div>${salvarBtn()}</form><p>${d.sem_familia} produtos ainda sem família aprovada. Pratos de almoço também entram na meta de pratos.</p></details>
 <details class="cadastro"><summary>3 · Metas de receita, almoço, pratos, chopes e produtos</summary><form id="form-meta"><div class="formgrid">${select('meta-metrica','Medida',[['receita','Receita bruta (R$)'],['almoco','Pratos de almoço (un.)'],['pratos','Pratos incluindo almoço (un.)'],['chopes','Chopes (unidades de produto)'],['produto','Produto específico (un.)']])}${select('meta-produto','Produto específico',optsProdutos)}${campo('meta-inicio','Início da meta','date',d.inicio)}${campo('meta-fim','Fim da meta','date',d.fim)}${select('meta-frequencia','Frequência',[['periodo','Total do período'],['diaria','Por dia selecionado']])}${campo('meta-alvo','Valor alvo: reais para receita; unidades para produtos','number','','min="0.001" step="0.001"')}${select('meta-ativo','Meta',[['true','Ativa'],['false','Inativa']])}${motivo('meta')}</div><p>Dias de aplicação da meta diária:</p><p>${[[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb'],[0,'Dom']].map(([v,t])=>'<label style="display:inline-block;margin-right:12px"><input type="checkbox" name="meta-dia" value="'+v+'" checked> '+t+'</label>').join('')}</p><p><button id="simular-meta" type="button">Simular +10% sobre o período exibido</button></p><p id="meta-simulacao" class="sub">Simulação é sugestão; só é registrada ao salvar.</p>${salvarBtn()}</form>${tabela(['Metas cadastradas','Período','Frequência','Alvo','Estado','Ação'],d.metas_config.map(m=>[esc(nomes[m.metrica])+(m.produto_id?' · '+esc(d.vendas.produtos.find(p=>p.id===m.produto_id)?.nome??m.produto_id):''),date(m.inicio)+' a '+date(m.fim),esc(m.frequencia),m.metrica==='receita'?money(m.alvo):num(m.alvo),m.ativo?'Ativa':'Inativa','<button type="button" data-edit-meta="'+m.evento_id+'">Revisar</button>']))}</details>
 <details class="cadastro"><summary>4 · CMO semanal</summary><form id="form-cmo"><div class="formgrid">${select('cmo-semana','Semana completa',semanas)}${select('cmo-situacao','Base',[['estimado','Estimado'],['conferido','Conferido']])}${moeda('cmo-salarios','Salários da semana')}${moeda('cmo-encargos','Encargos e provisões')}${moeda('cmo-beneficios','Benefícios')}${moeda('cmo-freelas','Freelas')}${moeda('cmo-extras','Extras e outros custos de pessoal')}${motivo('cmo')}</div>${salvarBtn()}</form></details>
 <details class="cadastro"><summary>5 · CMV do período selecionado</summary><form id="form-cmv"><p>${date(d.inicio)} a ${date(d.fim)} · valores a custo, com a mesma abrangência.</p><div class="formgrid">${moeda('cmv-estoque_inicial','Estoque inicial',d.cmv.base?.estoque_inicial??null)}${moeda('cmv-compras_liquidas','Compras líquidas de devoluções',d.cmv.base?.compras_liquidas??null)}${moeda('cmv-transferencias_entrada','Transferências recebidas',d.cmv.base?.transferencias_entrada??null)}${moeda('cmv-transferencias_saida','Transferências enviadas',d.cmv.base?.transferencias_saida??null)}${moeda('cmv-estoque_final','Estoque final',d.cmv.base?.estoque_final??null)}${select('cmv-situacao','Base',[['estimado','Estimado'],['conferido','Conferido']],d.cmv.base?.situacao??'estimado')}${motivo('cmv')}</div>${salvarBtn()}</form></details>
 <details class="cadastro"><summary>6 · Deduções e revisão da DRE</summary><form id="form-ajuste_dre"><div class="formgrid">${moeda('dre-descontos','Descontos e devoluções',d.ajuste?.descontos_devolucoes??null)}${moeda('dre-impostos','Impostos sobre vendas',d.ajuste?.impostos_vendas??null)}${motivo('ajuste_dre')}</div><p><label><input id="dre-receita" type="checkbox" ${d.ajuste?.receita_conciliada?'checked':''}> Receita do período conciliada</label><label><input id="dre-revisado" type="checkbox" ${d.ajuste?.lancamentos_revisados?'checked':''}> Revisei pessoal, impostos, taxas, despesas faltantes e rateios</label></p>${salvarBtn()}</form></details>
 <p><button id="historico">Ver histórico de versões</button></p><div id="historico-lista"></div></section>`;
 for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>tab(b.dataset.view);tab(view);el('abc-csv').onclick=()=>csv(d.abc);ligarFormularios();
}
function valor(id){const s=el(id).value;if(s==='')throw Error('Preencha os valores; informe zero quando não houver custo.');const n=Number(s);if(!Number.isFinite(n)||n<0)throw Error('Valor inválido.');return Math.round(n*100);}
function chave(tipo,d){if(tipo==='regra')return d.categoria+'|'+d.vigencia;if(tipo==='produto')return String(d.produto_id);if(tipo==='meta')return [d.metrica,d.produto_id??'',d.inicio,d.fim,d.frequencia].join('|');if(tipo==='cmo')return d.semana;return d.inicio+'|'+d.fim;}
async function salvar(tipo,dados){const motivo=el(tipo+'-motivo').value,ant=latest.eventos_atuais.find(x=>x.tipo===tipo&&x.chave===chave(tipo,dados));const d=await call('registrar',{tipo,dados,motivo,anterior:ant?.id??null});aviso(d.mensagem);await consultar();tab('cadastros');}
function ligarFormularios(){
 const sub=(tipo,get)=>el('form-'+tipo).onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await salvar(tipo,get());}catch(err){aviso(err.message,true);}finally{b.disabled=false;}};
 const span=()=>({inicio:latest.inicio,fim:latest.fim});
 sub('regra',()=>({categoria:el('regra-categoria').value,vigencia:el('regra-vigencia').value,grupo:el('regra-grupo').value,centro:el('regra-centro').value,comportamento:el('regra-comportamento').value,ativo:el('regra-ativo').value==='true'}));
 sub('produto',()=>({produto_id:el('produto-id').value,familia:el('produto-familia').value,ativo:el('produto-ativo').value==='true'}));
 sub('meta',()=>({inicio:el('meta-inicio').value,fim:el('meta-fim').value,metrica:el('meta-metrica').value,produto_id:el('meta-metrica').value==='produto'?el('meta-produto').value:null,frequencia:el('meta-frequencia').value,alvo:el('meta-metrica').value==='receita'?valor('meta-alvo'):Number(el('meta-alvo').value),dias_semana:[...document.querySelectorAll('[name=meta-dia]:checked')].map(x=>Number(x.value)),ativo:el('meta-ativo').value==='true'}));
 sub('cmo',()=>({semana:el('cmo-semana').value,situacao:el('cmo-situacao').value,fonte:el('cmo-motivo').value,...Object.fromEntries(['salarios','encargos','beneficios','freelas','extras'].map(k=>[k,valor('cmo-'+k)]))}));
 sub('cmv',()=>({...span(),situacao:el('cmv-situacao').value,fonte:el('cmv-motivo').value,...Object.fromEntries(['estoque_inicial','compras_liquidas','transferencias_entrada','transferencias_saida','estoque_final'].map(k=>[k,valor('cmv-'+k)]))}));
 sub('ajuste_dre',()=>({...span(),descontos_devolucoes:valor('dre-descontos'),impostos_vendas:valor('dre-impostos'),receita_conciliada:el('dre-receita').checked,lancamentos_revisados:el('dre-revisado').checked,fonte:el('ajuste_dre-motivo').value}));
 function preProduto(){const d=latest.produtos_config.find(p=>p.produto_id===el('produto-id').value);el('produto-familia').value=d?.familia??'outros';el('produto-ativo').value=String(d?.ativo??true);}el('produto-id').onchange=preProduto;preProduto();
 function preCmo(){const c=latest.cmo.find(w=>w.inicio===el('cmo-semana').value)?.base;for(const k of ['salarios','encargos','beneficios','freelas','extras'])el('cmo-'+k).value=c?(c[k]/100).toFixed(2):'';el('cmo-situacao').value=c?.situacao??'estimado';}el('cmo-semana').onchange=preCmo;preCmo();
 function preRegra(){const cat=el('regra-categoria').value,r=latest.configuracoes.filter(x=>x.categoria===cat&&x.vigencia<=latest.inicio).sort((a,b)=>b.vigencia.localeCompare(a.vigencia))[0];if(r){el('regra-grupo').value=r.grupo;el('regra-centro').value=r.centro;el('regra-comportamento').value=r.comportamento;el('regra-vigencia').value=r.vigencia;el('regra-ativo').value=String(r.ativo);}else{el('regra-vigencia').value=latest.inicio;el('regra-ativo').value='true';el('regra-grupo').value=/^Insumos:|Produtos para Revendas:/i.test(cat)?'compras_estoque':/Salários|Mão de Obra/i.test(cat)?'pessoal':'fixas';el('regra-centro').value=/Bebidas/i.test(cat)?'Bar e choperia':/^Insumos:|Utensílios de cozinha/i.test(cat)?'Cozinha':'Geral';el('regra-comportamento').value=/^Insumos:|Produtos para Revendas:/i.test(cat)?'variavel':'fixo';}}el('regra-categoria').onchange=preRegra;preRegra();
 el('simular-meta').onclick=()=>{const metrica=el('meta-metrica').value,pid=el('meta-produto').value,freq=el('meta-frequencia').value,ds=[...document.querySelectorAll('[name=meta-dia]:checked')].map(x=>Number(x.value)),days=latest.vendas.diario.filter(d=>freq!=='diaria'||ds.includes(new Date(d.data+'T12:00Z').getUTCDay()));if(!latest.cobertura||!days.length){aviso('Não há base de vendas para simular.',true);return;}if(['almoco','pratos','chopes'].includes(metrica)&&latest.sem_familia){aviso('Classifique as famílias dos produtos antes de simular esta meta.',true);return;}const map=new Map(latest.vendas.produtos.map(p=>[p.id,p.familia]));let real=0;for(const d of days){real+=metrica==='receita'?d.receita:metrica==='produto'?(d.produtos[pid]??0):Object.entries(d.produtos).reduce((a,[id,q])=>a+((metrica==='pratos'?['almoco','prato'].includes(map.get(id)):map.get(id)===(metrica==='almoco'?'almoco':'chope'))?q:0),0);}const suggest=real*1.1/(freq==='diaria'?days.length:1);el('meta-alvo').value=metrica==='receita'?(suggest/100).toFixed(2):Math.ceil(suggest);el('meta-simulacao').textContent='Cenário de +10% sobre '+date(latest.inicio)+' a '+date(latest.fim)+'. Não aprovado e não salvo; revise calendário, mix e capacidade.';};
 for(const b of document.querySelectorAll('[data-edit-meta]'))b.onclick=()=>{const m=latest.metas_config.find(x=>x.evento_id===b.dataset.editMeta);for(const k of ['inicio','fim','metrica','frequencia'])el('meta-'+k).value=m[k];el('meta-produto').value=m.produto_id??el('meta-produto').options[0]?.value??'';el('meta-alvo').value=m.metrica==='receita'?(m.alvo/100).toFixed(2):m.alvo;el('meta-ativo').value=String(m.ativo);for(const c of document.querySelectorAll('[name=meta-dia]'))c.checked=m.dias_semana.includes(Number(c.value));el('meta-motivo').value='';el('form-meta').closest('details').open=true;el('form-meta').scrollIntoView({behavior:'smooth',block:'start'});};
 el('historico').onclick=async()=>{try{const d=await call('historico');el('historico-lista').innerHTML=tabela(['Horário','Tipo','Chave','Motivo'],d.eventos.map(e=>[esc(new Date(e.criado_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})),esc(e.tipo),esc(e.chave),esc(e.motivo)]));}catch(e){aviso(e.message,true);}};
}
function csv(rows){const data=[['classe','produto','quantidade','valor_bruto_reais','participacao_percentual','acumulado_percentual'],...rows.map(r=>[r.classe,r.nome,String(r.qtd).replace('.',','),(r.centavos/100).toFixed(2).replace('.',','),r.participacao===null?'pendente':r.participacao.toFixed(4).replace('.',','),r.acumulado===null?'pendente':r.acumulado.toFixed(4).replace('.',',')])];const text='\uFEFF'+data.map(r=>r.map(x=>{let t=String(x);if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='feitoria-abc-'+latest.inicio+'-'+latest.fim+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
el('consultar').onclick=consultar;for(const id of ['inicio','fim'])el(id).onchange=()=>{latest=null;el('result').replaceChildren();aviso('Período alterado. Atualize a análise.');};
try{if(!unit)throw Error('Abra Resultados e metas dentro da gestão.');const s=await call('status');el('intro').textContent=s.unidade+' · acesso exclusivo do dono';el('inicio').value=s.inicio;el('fim').value=s.fim;el('consultar').disabled=false;await consultar();}catch(e){aviso(e.message,true);}
</script></body></html>
