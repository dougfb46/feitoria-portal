<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendas e horários · Feitoria</title><style>
:root{--ink:#233b30;--green:#245a43;--muted:#657165;--line:#dfe4da}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 12px}.sub,small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:13px}input,select,button{font:inherit;border:1px solid #b8c8ba;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.6;cursor:wait}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card strong{display:block;font-size:26px;margin:8px 0;color:var(--green)}.warning{background:#fff4df;border-left:4px solid #c58d38;padding:12px 16px;margin:16px 0}.error{color:#922f24}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--green)}.num{text-align:right;white-space:nowrap}#heat td{text-align:center;min-width:61px;padding:8px 4px;border:3px solid white;border-radius:6px;font-size:11px}#heat th:first-child{position:sticky;left:0;background:white;min-width:100px}summary{cursor:pointer;font-weight:600;color:var(--green)}#progress{white-space:pre-line}a{color:var(--green)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}main{padding:10px}.panel{padding:14px}.card strong{font-size:22px}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
</style></head><body><main><h1>Vendas e horários</h1><p id="intro" class="sub">Conferindo sua sessão de gestão…</p><section class="panel"><div class="filters"><label for="inicio">Início<input id="inicio" type="date"></label><label for="fim">Fim<input id="fim" type="date"></label><label for="canal">Canal<select id="canal"><option value="presencial">Presencial</option><option value="delivery">Delivery</option><option value="todos">Todos</option></select></label><button id="consultar" class="primary">Consultar</button><button id="importar" hidden>Importar / atualizar período</button><button id="pausar" hidden>Pausar após esta página</button></div><p class="sub">Até 93 dias encerrados. Dia operacional: 01h30 · São Paulo. A importação consulta somente leitura da Takeat e pode levar alguns minutos; mantenha esta área aberta até concluir.</p><p id="progress" role="status" aria-live="polite"></p></section><div id="result"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ',sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id');
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),money=x=>x===null||x===undefined?'Pendente':fmt.format(x/100),day=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
let running=false,pause=false,latest=null;
async function call(acao,body={}){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Sua sessão terminou. Entre novamente no portal de gestão.');const r=await fetch(SB+'/functions/v1/gestao-vendas',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...body})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível consultar.');return d;}
function aviso(t,err=false){el('progress').textContent=t;el('progress').className=err?'error':'';}
function busy(v){running=v;for(const id of ['inicio','fim','canal','consultar','importar'])el(id).disabled=v;el('pausar').hidden=!v;}
async function status(first=false){const s=await call('status');el('intro').textContent=s.unidade+' · informações restritas à gestão';el('importar').hidden=!s.dono;el('fim').max=s.fim_padrao;el('inicio').max=s.fim_padrao;if(first){el('inicio').value=s.ultima?.inicio??s.inicio_padrao;el('fim').value=s.ultima?.fim??s.fim_padrao;}return s;}
async function consultar(){try{aviso('Consultando a última coleta completa…');const d=await call('resumo',{inicio:el('inicio').value,fim:el('fim').value,canal:el('canal').value});latest=d;render(d);aviso('Coleta concluída em '+new Date(d.coleta.concluido_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · '+d.coleta.sessoes+' sessões consultadas em '+d.coleta.pagina+' páginas.');}catch(e){el('result').replaceChildren();latest=null;aviso(e.message,true);}}
async function importar(){pause=false;busy(true);try{const {coleta}=await call('iniciar',{inicio:el('inicio').value,fim:el('fim').value});let total=coleta.sessoes;while(!pause){aviso('Importando: '+total+' sessões já recebidas. Você pode pausar e retomar sem perder as páginas concluídas.');const r=await call('pagina',{coleta_id:coleta.id});if(r.sessoes!==undefined)total=r.sessoes;if(r.completa){aviso('Importação concluída.');await consultar();await status();return;}await new Promise(resolve=>setTimeout(resolve,Math.max(1000,r.aguardar_ms??6500)));}aviso('Importação pausada. Use Importar / atualizar para retomar o mesmo período.');}catch(e){aviso(e.message+' Use Importar / atualizar para retomar.',true);}finally{busy(false);}}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function render(d){const t=d.totais,q=d.qualidade;el('result').innerHTML=`<div class="cards"><div class="card"><small>Produtos lançados</small><strong>${money(t.bruto_centavos)}</strong><small>Bruto de itens, antes do desconto de conta</small></div><div class="card"><small>Comandas concluídas</small><strong>${t.comandas}</strong><small>Iniciadas dentro do período selecionado</small></div><div class="card"><small>Ticket por comanda</small><strong>${money(t.ticket_centavos)}</strong><small>Total informado Takeat ÷ comandas da mesma população</small></div><div class="card"><small>Total das comandas</small><strong>${money(t.comandas_com_total===t.comandas?t.total_comandas_centavos:null)}</strong><small>Campo total_price informado pela Takeat</small></div></div><div class="warning">${q.itens_invalidos||q.total_ausente?'<b>Atenção: há valores inválidos ou ausentes; confira os critérios antes de usar o total.</b> ':''}<b>Ticket por pessoa ainda não validado.</b> ${q.pessoas_preenchidas} comandas têm pessoas preenchidas; ${q.pessoas_igual_um} informam uma pessoa. Esse preenchimento não comprova a contagem real. Os cartões de produtos e ticket usam datas e bases diferentes; não são uma conciliação de caixa nem lucro.</div><section class="panel"><h2>Semanas</h2><p class="sub">Segunda a domingo operacional. Ticket semanal calculado pela soma dos totais ÷ comandas, sem fazer média simples dos tickets diários.</p>${table(['Semana iniciada','Datas no recorte','Produtos lançados','Comandas iniciadas','Total Takeat','Ticket por comanda'],d.semanal.map(r=>[day(r.inicio),r.dias,money(r.bruto_centavos),r.comandas,money(r.comandas_com_total===r.comandas?r.total_comandas_centavos:null),money(r.ticket_centavos)]))}</section><section class="panel"><h2>Mapa de calor · produtos lançados</h2><p class="sub">Média por intervalo de 30 minutos e dia da semana. Mesma escala de cores para todos os dias. Datas sem venda retornada entram na média; isso não comprova loja fechada.</p><p><label><input type="checkbox" id="horarios24"> Mostrar as 24 horas (padrão: 11h às 01h30)</label></p><div class="scroll"><table id="heat"></table></div><p class="sub" id="heat-info">Toque em uma célula para conferir o valor e a amostra. O horário é do grupo de pedidos.</p></section><section class="panel"><details><summary>Diário e arquivo de conferência</summary><p><button id="csv">Baixar CSV diário</button></p>${table(['Dia operacional','Produtos lançados','Comandas iniciadas','Total Takeat','Ticket por comanda'],d.diario.map(r=>[day(r.data),money(r.bruto_centavos),r.comandas,money(r.comandas_com_total===r.comandas?r.total_comandas_centavos:null),money(r.ticket_centavos)]))}</details></section><section class="panel"><h2>Produtos · maiores valores lançados</h2><p class="sub">Até 30 produtos por valor bruto de lançamento. Quantidades de formatos diferentes não são litros ou porções equivalentes. Não é ranking de lucro.</p>${table(['Produto','Quantidade informada','Valor bruto'],d.produtos.map(p=>[esc(p.nome),esc(p.qtd),money(p.centavos)]))}</section><section class="panel"><details><summary>Critérios, cobertura e limitações</summary><ul>${Object.values(d.criterios).map(s=>'<li>'+esc(s)+'</li>').join('')}${d.observacoes.map(s=>'<li>'+esc(s)+'</li>').join('')}</ul><p>Coleta: ${day(d.coleta.inicio)} a ${day(d.coleta.fim)} · canal: ${esc(d.canal)}.</p><p>Excluídas por estado não concluído: ${q.sessoes_excluidas} sessões. Itens cancelados identificados: ${q.itens_cancelados}. Itens inválidos: ${q.itens_invalidos}. Totais de comanda ausentes: ${q.total_ausente}. Comandas com total zero: ${q.comandas_cortesia}.</p><p>Essas contagens incluem sessões da margem de consulta; não são taxas de cancelamento do período. Falta de pedidos não comprova falta de clientes. Não há informação de custo, ocupação ou vendedor inferida.</p></details></section>`;
 desenharMapa(d);el('horarios24').onchange=()=>desenharMapa(d,el('horarios24').checked);el('csv').onclick=exportar;
}
function desenharMapa(d,all=false){
 const slots=all?[...Array.from({length:45},(_,i)=>i+3),0,1,2]:[...Array.from({length:26},(_,i)=>i+22),0,1,2],max=Math.max(0,...d.mapa.filter(x=>slots.includes(x.slot)).map(x=>x.media_centavos??0)),labels=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
 el('heat').innerHTML='<thead><tr><th>Dia / amostra</th>'+slots.map(s=>'<th>'+String(Math.floor(s/2)).padStart(2,'0')+':'+(s%2?'30':'00')+'</th>').join('')+'</tr></thead><tbody>'+[1,2,3,4,5,6,0].map(dow=>'<tr><th>'+labels[dow]+'<br><small>'+d.mapa.find(x=>x.dow===dow).datas+' datas</small></th>'+slots.map(slot=>{const c=d.mapa.find(x=>x.dow===dow&&x.slot===slot),v=c.media_centavos,a=max&&v!==null?v/max:0,bg='rgb('+Math.round(243-a*213)+','+Math.round(244-a*160)+','+Math.round(224-a*151)+')';return '<td tabindex="0" data-dow="'+dow+'" data-slot="'+slot+'" style="background:'+bg+';color:'+(a>.55?'white':'#233b30')+'">'+(v===null?'—':money(v))+'</td>';}).join('')+'</tr>').join('')+'</tbody>';
 const detail=e=>{const cell=e.target.closest('td[data-slot]');if(!cell)return;const c=d.mapa.find(x=>x.dow===Number(cell.dataset.dow)&&x.slot===Number(cell.dataset.slot));el('heat-info').textContent=labels[c.dow]+' · '+String(Math.floor(c.slot/2)).padStart(2,'0')+':'+(c.slot%2?'30':'00')+' · '+c.datas+' datas · média '+money(c.media_centavos)+' · '+c.grupos+' grupos no recorte.';};el('heat').onclick=detail;el('heat').onkeydown=e=>{if(e.key==='Enter')detail(e);};
}
function exportar(){if(!latest)return;const rows=[['dia_operacional','produtos_brutos_reais','comandas_iniciadas','total_takeat_reais','ticket_comanda_reais'],...latest.diario.map(r=>[r.data,(r.bruto_centavos/100).toFixed(2).replace('.',','),r.comandas,r.comandas_com_total!==r.comandas?'pendente':(r.total_comandas_centavos/100).toFixed(2).replace('.',','),r.ticket_centavos===null?'pendente':(r.ticket_centavos/100).toFixed(2).replace('.',',')])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='feitoria-vendas-'+latest.inicio+'-'+latest.fim+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
el('consultar').onclick=consultar;el('importar').onclick=importar;el('pausar').onclick=()=>{pause=true;aviso('Pausando após a etapa em andamento…');};
try{if(!unit)throw Error('Abra Vendas e horários dentro do portal de gestão.');const s=await status(true);if(s.ultima)await consultar();else aviso('Ainda não há coleta completa. O dono pode importar o período para começar.');}catch(e){el('intro').textContent='Acesso de gestão necessário';aviso(e.message,true);el('consultar').disabled=true;}
</script></body></html>
