<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · Feitoria</title><style>
:root{--ink:#233b30;--green:#245a43;--muted:#657165;--line:#dfe4da}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 12px}.sub,small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:13px}input,select,button{font:inherit;border:1px solid #b8c8ba;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.6;cursor:wait}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card strong{display:block;font-size:26px;margin:8px 0;color:var(--green)}.warning{background:#fff4df;border-left:4px solid #c58d38;padding:12px 16px;margin:16px 0}.error{color:#922f24}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--green)}.num{text-align:right;white-space:nowrap}#heat td{text-align:center;min-width:61px;padding:8px 4px;border:3px solid white;border-radius:6px;font-size:11px}#heat th:first-child{position:sticky;left:0;background:white;min-width:100px}summary{cursor:pointer;font-weight:600;color:var(--green)}#progress{white-space:pre-line}a{color:var(--green)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}main{padding:10px}.panel{padding:14px}.card strong{font-size:22px}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Financeiro · base da DRE</h1><p id="intro" class="sub">Conferindo acesso do dono…</p>
<section class="panel"><div class="filters"><label for="inicio">Início<input id="inicio" type="date"></label><label for="fim">Fim<input id="fim" type="date"></label><label for="base">Datas<select id="base"><option value="competence_date">Competência</option><option value="due_date">Vencimento</option></select></label><button id="consultar" class="primary">Consultar</button><button id="importar" hidden>Importar / atualizar</button><button id="pausar" hidden>Pausar</button></div><p class="sub">Até 92 dias de calendário. A importação lê os lançamentos da Takeat; mantenha esta aba aberta até concluir.</p><p id="progress" role="status" aria-live="polite"></p></section><div id="result"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ',sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id');
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),money=v=>v===null||v===undefined?'Pendente':fmt.format(v/100);
let running=false,pause=false,latest=null;
const parametros=()=>({inicio:el('inicio').value,fim:el('fim').value,base:el('base').value});
function aviso(t,erro=false){el('progress').textContent=t;el('progress').className=erro?'error':'';}
function controles(v){for(const id of ['inicio','fim','base','consultar','importar'])el(id).disabled=v;}
async function call(acao,body={}){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Entre novamente no portal de gestão.');const r=await fetch(SB+'/functions/v1/gestao-financeiro',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...body})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível consultar.');return d;}
async function status(){const s=await call('status');el('intro').textContent=s.unidade+' · acesso exclusivo do dono';el('inicio').value=s.ultima?.inicio??s.inicio_padrao;el('fim').value=s.ultima?.fim??s.fim_padrao;el('base').value=s.ultima?.base??'competence_date';el('importar').hidden=false;return s;}
async function consultar(){controles(true);try{aviso('Consultando coleta completa…');el('result').replaceChildren();latest=null;const d=await call('resumo',parametros());latest=d;render(d);aviso('Coleta concluída em '+new Date(d.coleta.concluido_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · '+d.principais+' lançamentos principais em '+d.coleta.pagina+' páginas.');}catch(e){aviso(e.message,true);}finally{if(!running)controles(false);}}
async function importar(){running=true;pause=false;controles(true);el('pausar').hidden=false;try{const {coleta}=await call('iniciar',parametros());let n=coleta.registros;while(!pause){aviso('Importando: '+n+' lançamentos principais recebidos…');const r=await call('pagina',{coleta_id:coleta.id});if(r.registros!==undefined)n=r.registros;if(r.completa){await consultar();return;}await new Promise(resolve=>setTimeout(resolve,Math.max(1000,r.aguardar_ms??6500)));}aviso('Pausado. Use Importar / atualizar para retomar o mesmo período e base.');}catch(e){aviso(e.message+' É possível retomar a coleta.',true);}finally{running=false;controles(false);el('pausar').hidden=true;}}
function tabela(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function render(d){const t=d.totais,q=d.qualidade;
const cards=[['Receitas lançadas',t.total_earnings],['Despesas lançadas',t.total_expenses],['Receitas marcadas recebidas',t.total_earnings_paid],['Despesas marcadas pagas',t.total_expenses_paid]];
el('result').innerHTML='<div class="cards">'+cards.map(([title,value])=>'<div class="card"><small>'+title+'</small><strong>'+money(value)+'</strong><small>Total informado pela Takeat</small></div>').join('')+'</div><div class="warning"><b>'+(d.conferido?'Totais conferidos com as páginas recebidas.':'Conferência pendente: há diferenças ou valores ausentes.')+'</b> O estado pago/recebido é atual; não representa pagamentos ocorridos neste mês. Estes dados ainda não constituem uma DRE fechada.</div><section class="panel"><h2>Despesas e receitas por categoria</h2><p class="sub">Somente lançamentos marcados para resultado, pelo critério de datas selecionado. Principais e itens não são somados duas vezes.</p><p>Fora desta classificação por não terem marcação de resultado: receitas <b>'+money(d.fora_categorias.receitas)+'</b>; despesas <b>'+money(d.fora_categorias.despesas)+'</b> ('+d.fora_categorias.registros+' lançamentos principais). Esses valores permanecem nos cartões totais.</p><p><button id="csv">Baixar categorias em CSV</button></p>'+tabela(['Categoria','Despesas','Receitas','Lançamentos'],d.categorias.map(r=>[esc(r.categoria),money(r.despesas),money(r.receitas),r.lancamentos]))+'</section><section class="panel"><h2>Conferência e qualidade dos dados</h2><p>Lançamentos principais sem competência própria, usando vencimento: <b>'+q.sem_competencia+'</b>. Sem categoria: <b>'+q.sem_categoria+'</b>. Fora do recorte: <b>'+q.fora_recorte+'</b>. Valores ausentes: <b>'+q.valores_ausentes+'</b>. Hierarquias ambíguas: <b>'+q.hierarquia_ambigua+'</b>.</p>'+tabela(['Total','Diferença páginas − Takeat'],Object.entries(d.conciliacao).map(([k,v])=>[esc(({total_earnings:'Receitas',total_expenses:'Despesas',total_earnings_paid:'Receitas recebidas',total_expenses_paid:'Despesas pagas'})[k]),money(v)]))+'<p class="sub">Diferença zero confere a soma da importação; não comprova que todos os gastos e receitas do negócio foram lançados.</p></section><section class="panel"><h2>O que falta para fechar a DRE</h2><ul><li>Conciliar as vendas com os lançamentos de receita, sem somar duas vezes.</li><li>Revisar a classificação das categorias: custos, despesas, investimentos e retiradas.</li><li>Conferir estoque inicial + compras − estoque final para apurar o CMV.</li><li>Conferir pessoal, impostos, taxas e despesas ainda não lançadas.</li></ul><details><summary>Critérios e limitações</summary><ul>'+d.limites.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details></section>';
el('csv').onclick=exportar;}
function exportar(){if(!latest)return;const rows=[['categoria','despesas_reais','receitas_reais','lancamentos'],...latest.categorias.map(r=>[r.categoria,(r.despesas/100).toFixed(2).replace('.',','),(r.receitas/100).toFixed(2).replace('.',','),r.lancamentos])];const safe=x=>{const s=String(x);return /^[=+@-]/.test(s)?"'"+s:s;};const csv='\uFEFF'+rows.map(r=>r.map((x,i)=>'"'+(i===0?safe(x):String(x)).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='feitoria-financeiro-'+latest.coleta.base+'-'+latest.coleta.inicio+'-'+latest.coleta.fim+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
el('consultar').onclick=consultar;el('importar').onclick=importar;el('pausar').onclick=()=>{pause=true;aviso('Pausando após esta etapa…');};
try{if(!unit)throw Error('Abra Financeiro dentro do portal de gestão.');const s=await status();if(s.ultima)await consultar();else aviso('Importe o mês para iniciar a conferência.');}catch(e){el('intro').textContent='Acesso exclusivo do dono';aviso(e.message,true);controles(true);}
</script></body></html>
