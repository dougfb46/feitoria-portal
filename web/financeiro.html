<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · Feitoria</title><style>
:root{--ink:#233b30;--green:#245a43;--muted:#657165;--line:#dfe4da}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 12px}.sub,small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:13px}input,select,button{font:inherit;border:1px solid #b8c8ba;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.6;cursor:wait}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card strong{display:block;font-size:26px;margin:8px 0;color:var(--green)}.warning{background:#fff4df;border-left:4px solid #c58d38;padding:12px 16px;margin:16px 0}.error{color:#922f24}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--green)}.num{text-align:right;white-space:nowrap}#heat td{text-align:center;min-width:61px;padding:8px 4px;border:3px solid white;border-radius:6px;font-size:11px}#heat th:first-child{position:sticky;left:0;background:white;min-width:100px}summary{cursor:pointer;font-weight:600;color:var(--green)}#progress{white-space:pre-line}a{color:var(--green)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}main{padding:10px}.panel{padding:14px}.card strong{font-size:22px}}@media(max-width:430px){.cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Financeiro · base da DRE</h1><p id="intro" class="sub">Conferindo acesso do dono…</p>
<section class="panel" id="cobertura" hidden></section>
<section class="panel"><div class="filters"><label for="fonte">Fonte<select id="fonte"><option value="espelho">Automática (todo dia)</option><option value="manual">Importação manual</option></select></label><label for="inicio">Início<input id="inicio" type="date"></label><label for="fim">Fim<input id="fim" type="date"></label><label for="base">Datas<select id="base"><option value="competence_date">Competência</option><option value="due_date">Vencimento</option></select></label><button id="consultar" class="primary">Consultar</button><button id="importar" hidden>Importar / atualizar</button><button id="pausar" hidden>Pausar</button></div><p class="sub" id="dica">Até 92 dias de calendário.</p><p id="progress" role="status" aria-live="polite"></p></section><div id="result"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const SB='https://kujelbcbrcmkitzyswbh.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ',sb=createClient(SB,ANON),unit=new URLSearchParams(location.search).get('restaurant_id');
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),money=v=>v===null||v===undefined?'Pendente':fmt.format(v/100);
let running=false,pause=false,latest=null;
const parametros=()=>({inicio:el('inicio').value,fim:el('fim').value,base:el('base').value});
const quando=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',',' às'):'sem registro';
const dia=v=>v?v.slice(8,10)+'/'+v.slice(5,7):'—';
const manual=()=>el('fonte').value==='manual';
let estado=null;
function aviso(t,erro=false){el('progress').textContent=t;el('progress').className=erro?'error':'';}
// Aviso de dado velho (veio do site público em 20/11): só para a importação manual.
function idadeDado(iso,alternativa){document.getElementById('aviso-idade')?.remove();if(!iso)return;const q=new Date(iso),dias=Math.floor((Date.now()-q)/864e5);if(!(dias>=2))return;const p=document.createElement('p');p.id='aviso-idade';p.className='warning';p.setAttribute('role','alert');p.style.fontWeight='600';p.textContent='Atenção: estes números são da importação de '+q.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'})+' (há '+dias+' dias) e não incluem os dias seguintes. '+alternativa;document.querySelector('main').prepend(p);}
function controles(v){for(const id of ['fonte','inicio','fim','base','consultar','importar'])el(id).disabled=v;}
// Até onde vão os dados: o que entrou na Takeat, o que foi marcado pago e quando o portal leu.
function cobertura(a,recorte){if(!a)return;const velho=a.coleta_concluida&&Date.now()-Date.parse(a.coleta_concluida)>36*3600e3;
 el('cobertura').hidden=false;el('cobertura').innerHTML='<h2>Até onde vão estes dados</h2><div class="cards">'
 +[['Última despesa lançada na Takeat',a.despesas_ate,'Contas, compras, folha'],['Última despesa marcada paga',a.despesas_pagas_ate,'Baixa feita na Takeat'],['Última receita lançada',a.receitas_ate,'Vendas e outras entradas'],['Última receita marcada recebida',a.receitas_recebidas_ate,'Baixa feita na Takeat']].map(([t,v,s])=>{const atraso=v&&Date.now()-Date.parse(v)>7*86400e3;return '<div class="card"><small>'+t+'</small><strong'+(atraso?' style="color:#922f24"':'')+'>'+esc(quando(v))+'</strong><small>'+(atraso?'Há mais de 7 dias sem registro novo':s)+'</small></div>';}).join('')
 +'<div class="card"><small>Leitura automática do portal</small><strong>'+esc(quando(a.coleta_concluida))+'</strong><small>Todo dia às 05h00 · vencimentos de '+esc(dia(a.janela_inicio))+' a '+esc(dia(a.janela_fim))+'</small></div>'
 +'<div class="card"><small>Conferido com o banco</small><strong>Ainda não</strong><small>A conciliação com o extrato é a próxima etapa</small></div></div>'
 +(velho?'<p class="error"><b>A leitura automática está atrasada.</b> Os números abaixo podem não ter o que entrou depois de '+esc(quando(a.coleta_concluida))+'.</p>':'')
 +(recorte&&!recorte.dentro_janela?'<p class="warning">Parte deste período fica fora da leitura diária. Esses lançamentos foram atualizados pela última vez em <b>'+esc(quando(recorte.recorte_atualizado_desde))+'</b>; um pagamento feito depois disso pode não aparecer.</p>':'')
 +'<p class="sub">“Pago” e “recebido” são o que foi marcado na Takeat. Lançamento que ainda não foi feito lá não aparece aqui.</p>';}
async function call(acao,body={}){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error('Entre novamente no portal de gestão.');const r=await fetch(SB+'/functions/v1/gestao-financeiro',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({acao,restaurant_id:unit,...body})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível consultar.');return d;}
// Período padrão da fonte automática: o mês corrente inteiro, por competência.
function padrao(){const h=estado?.hoje;if(manual()){el('inicio').value=estado.ultima?.inicio??estado.inicio_padrao;el('fim').value=estado.ultima?.fim??estado.fim_padrao;el('base').value=estado.ultima?.base??'competence_date';}
 else if(h){const y=Number(h.slice(0,4)),m=Number(h.slice(5,7));el('inicio').value=h.slice(0,8)+'01';el('fim').value=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);el('base').value='competence_date';}
 el('importar').hidden=!manual();el('dica').textContent=manual()?'Até 92 dias de calendário. A importação manual lê os lançamentos da Takeat e confere com os totais dela; mantenha esta aba aberta até concluir. A última importação foi em '+quando(estado.ultima?.concluido_em)+'.':'Até 92 dias de calendário. Usa a leitura automática diária; não precisa importar.';}
async function status(){const s=await call('status');estado=s;el('intro').textContent=s.unidade+' · acesso exclusivo do dono';cobertura(s.automatico);padrao();return s;}
async function consultar(){controles(true);try{aviso('Consultando…');el('result').replaceChildren();latest=null;
 document.getElementById('aviso-idade')?.remove();
 if(manual()){const d=await call('resumo',parametros());latest=d;render(d);idadeDado(d.coleta?.concluido_em,'Para números de hoje, troque a fonte para “Automática (todo dia)”.');aviso('Importação manual concluída em '+quando(d.coleta.concluido_em)+' · '+d.principais+' lançamentos principais em '+d.coleta.pagina+' páginas.');}
 else{const d=await call('espelho',parametros());latest=d;cobertura(d.cobertura,d.cobertura);render(d);aviso(d.principais+' lançamentos principais de '+dia(el('inicio').value)+' a '+dia(el('fim').value)+(d.orfaos?' · '+d.orfaos+' itens sem lançamento principal ficaram de fora':'')+'.');}
}catch(e){aviso(e.message,true);}finally{if(!running)controles(false);}}
async function importar(){running=true;pause=false;controles(true);el('pausar').hidden=false;try{const {coleta}=await call('iniciar',parametros());let n=coleta.registros;while(!pause){aviso('Importando: '+n+' lançamentos principais recebidos…');const r=await call('pagina',{coleta_id:coleta.id});if(r.registros!==undefined)n=r.registros;if(r.completa){await consultar();return;}await new Promise(resolve=>setTimeout(resolve,Math.max(1000,r.aguardar_ms??6500)));}aviso('Pausado. Use Importar / atualizar para retomar o mesmo período e base.');}catch(e){aviso(e.message+' É possível retomar a coleta.',true);}finally{running=false;controles(false);el('pausar').hidden=true;}}
function tabela(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function render(d){const t=d.totais,q=d.qualidade,auto=d.fonte==='espelho',a=d.abertos;
const cards=[['Receitas lançadas',t.total_earnings],['Despesas lançadas',t.total_expenses],['Receitas marcadas recebidas',t.total_earnings_paid],['Despesas marcadas pagas',t.total_expenses_paid]];
const abertosHtml=auto?'<div class="cards" style="margin-top:12px">'+[['A pagar em aberto',a.pagar,a.pagar_n],['Vencido sem baixa (pagar)',a.vencido_pagar,a.vencido_pagar_n],['A receber em aberto',a.receber,a.receber_n],['Vencido sem baixa (receber)',a.vencido_receber,a.vencido_receber_n]].map(([title,v,n])=>'<div class="card"><small>'+title+'</small><strong>'+money(v)+'</strong><small>'+n+' lançamento'+(n===1?'':'s')+' neste período</small></div>').join('')+'</div>':'';
const conferencia=auto?'<b>Números calculados da leitura automática.</b> “Vencido sem baixa” pode ser conta já paga que ainda não foi marcada na Takeat: confira antes de cobrar ou pagar de novo.':'<b>'+(d.conferido?'Totais conferidos com as páginas recebidas.':'Conferência pendente: há diferenças ou valores ausentes.')+'</b>';
el('result').innerHTML='<div class="cards">'+cards.map(([title,value])=>'<div class="card"><small>'+title+'</small><strong>'+money(value)+'</strong><small>'+(auto?'Soma dos lançamentos lidos':'Total informado pela Takeat')+'</small></div>').join('')+'</div>'+abertosHtml+'<div class="warning">'+conferencia+' O estado pago/recebido é atual; não representa pagamentos ocorridos neste mês. Estes dados ainda não constituem uma DRE fechada.</div><section class="panel"><h2>Despesas e receitas por categoria</h2><p class="sub">Somente lançamentos marcados para resultado, pelo critério de datas selecionado. Principais e itens não são somados duas vezes.</p><p>Fora desta classificação por não terem marcação de resultado: receitas <b>'+money(d.fora_categorias.receitas)+'</b>; despesas <b>'+money(d.fora_categorias.despesas)+'</b> ('+d.fora_categorias.registros+' lançamentos principais). Esses valores permanecem nos cartões totais.</p><p>Diferença entre categorias e principais cobertos: despesas <b>'+money(d.diferenca_categorias.despesas)+'</b>; receitas <b>'+money(d.diferenca_categorias.receitas)+'</b>. Diferenças exigem revisão antes de fechar a DRE.</p><p><button id="csv">Baixar categorias em CSV</button></p>'+tabela(['Categoria','Despesas','Receitas','Lançamentos'],d.categorias.map(r=>[esc(r.categoria),money(r.despesas),money(r.receitas),r.lancamentos]))+'</section><section class="panel"><h2>Conferência e qualidade dos dados</h2><p>Lançamentos principais sem competência própria, usando vencimento: <b>'+q.sem_competencia+'</b>. Sem categoria: <b>'+q.sem_categoria+'</b>. Fora do recorte: <b>'+q.fora_recorte+'</b>. Valores ausentes: <b>'+q.valores_ausentes+'</b>. Hierarquias ambíguas: <b>'+q.hierarquia_ambigua+'</b>.</p>'+(auto?'<p class="sub">A leitura automática não traz os totais da Takeat para comparar. Para conferir um mês contra os totais dela, use a fonte “Importação manual”.</p>':tabela(['Total','Diferença páginas − Takeat'],Object.entries(d.conciliacao).map(([k,v])=>[esc(({total_earnings:'Receitas',total_expenses:'Despesas',total_earnings_paid:'Receitas recebidas',total_expenses_paid:'Despesas pagas'})[k]),money(v)]))+'<p class="sub">Diferença zero confere a soma da importação; não comprova que todos os gastos e receitas do negócio foram lançados.</p>')+'</section><section class="panel"><h2>O que falta para fechar a DRE</h2><ul><li>Conciliar as vendas com os lançamentos de receita, sem somar duas vezes.</li><li>Revisar a classificação das categorias: custos, despesas, investimentos e retiradas.</li><li>Conferir estoque inicial + compras − estoque final para apurar o CMV.</li><li>Conferir pessoal, impostos, taxas e despesas ainda não lançadas.</li></ul><details><summary>Critérios e limitações</summary><ul>'+d.limites.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details></section>';
el('csv').onclick=exportar;}
function exportar(){if(!latest)return;const rows=[['categoria','despesas_reais','receitas_reais','lancamentos'],...latest.categorias.map(r=>[r.categoria,(r.despesas/100).toFixed(2).replace('.',','),(r.receitas/100).toFixed(2).replace('.',','),r.lancamentos])];const safe=x=>{const s=String(x);return /^[=+@-]/.test(s)?"'"+s:s;};const csv='\uFEFF'+rows.map(r=>r.map((x,i)=>'"'+(i===0?safe(x):String(x)).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const p=latest.coleta??parametros();a.download='feitoria-financeiro-'+p.base+'-'+p.inicio+'-'+p.fim+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
for(const id of ['inicio','fim','base'])el(id).onchange=()=>{latest=null;el('result').replaceChildren();aviso('Filtros alterados. Clique em Consultar'+(manual()?' ou importe a nova seleção.':'.'));};
el('fonte').onchange=()=>{latest=null;el('result').replaceChildren();padrao();if(!manual())cobertura(estado.automatico);consultar();};
el('consultar').onclick=consultar;el('importar').onclick=importar;el('pausar').onclick=()=>{pause=true;aviso('Pausando após esta etapa…');};
try{if(!unit)throw Error('Abra Financeiro dentro do portal de gestão.');await status();await consultar();}catch(e){el('intro').textContent='Acesso exclusivo do dono';aviso(e.message,true);controles(true);}
</script></body></html>
